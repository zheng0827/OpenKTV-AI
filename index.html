<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI KTV 視覺化播放器</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .player-container {
            text-align: center;
            width: 80%;
            max-width: 800px;
        }

        /* 歌詞外框區塊 */
        .lyrics-box {
            font-size: 3rem;
            font-weight: bold;
            margin: 40px 0;
            line-height: 1.5;
            min-height: 150px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* 每個單字的基礎設定 */
        .char-box {
            position: relative;
            display: inline-block;
            margin: 0 2px;
            color: #ffffff; /* 還沒唱到的顏色 (白) */
        }

        /* KTV 刷過的覆蓋層 */
        .char-fill {
            position: absolute;
            left: 0;
            top: 0;
            color: #00e5ff; /* 唱過去的顏色 (霓虹藍) */
            overflow: hidden;
            white-space: nowrap;
            width: 0%; /* 透過 JS 動態控制這個寬度 */
            /* 讓刷字更平滑 */
            transition: width 0.05s linear; 
        }

        audio {
            width: 100%;
            border-radius: 30px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- 音樂播放器 -->
        <audio id="audio" controls>
            <source src="vocals.wav" type="audio/wav">
            您的瀏覽器不支援音訊元素。
        </audio>

        <!-- 歌詞顯示區 -->
        <div class="lyrics-box" id="lyrics-box">
            載入歌詞中...
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const lyricsBox = document.getElementById('lyrics-box');
        let charData = [];

        // 1. 讀取 JSON 檔案
        fetch('timing.json')
            .then(response => response.json())
            .then(data => {
                charData = data;
                renderLyrics();
            })
            .catch(error => {
                lyricsBox.innerHTML = "❌ 無法載入 timing.json，請確認檔案是否存在。";
                console.error("Error loading JSON:", error);
            });

        // 2. 將 JSON 資料轉換為 HTML 元素
        function renderLyrics() {
            lyricsBox.innerHTML = ''; // 清空原本內容

            charData.forEach((item, index) => {
                const span = document.createElement('span');
                span.className = 'char-box';
                
                // 結構：<span class="char-box">字<span class="char-fill">字</span></span>
                span.innerHTML = `
                    ${item.char}
                    <span class="char-fill" id="fill-${index}">${item.char}</span>
                `;
                lyricsBox.appendChild(span);
            });
        }

        // 3. 監聽音樂播放進度，實現 KTV 刷字特效
        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;

            charData.forEach((item, index) => {
                const fillElement = document.getElementById(`fill-${index}`);
                if (!fillElement) return;

                if (currentTime >= item.end) {
                    // 已經唱完這個字：100% 填滿
                    fillElement.style.width = '100%';
                } else if (currentTime >= item.start && currentTime < item.end) {
                    // 正在唱這個字：計算百分比
                    const progress = ((currentTime - item.start) / (item.end - item.start)) * 100;
                    fillElement.style.width = `${progress}%`;
                } else {
                    // 還沒唱到：0%
                    fillElement.style.width = '0%';
                }
            });
        });
    </script>
</body>
</html>

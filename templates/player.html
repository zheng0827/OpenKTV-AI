<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KTV Player</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
        #root { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        #topbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        #status { background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px; font-size: 14px; }
        .btn { border: 1px solid #fff; background: rgba(0,0,0,0.4); color: #fff; border-radius: 6px; padding: 8px 12px; cursor: pointer; margin-left: 8px; }
        #lyrics { position: absolute; left: 0; right: 0; bottom: 0; height: 28vh; padding: 16px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 30%, rgba(0,0,0,0.9) 100%); z-index: 10; pointer-events: none; }
        #countdown { text-align: center; font-size: 30px; color: #ffd54f; min-height: 38px; font-weight: bold; }
        #line1, #line2 { font-size: 32px; line-height: 1.4; text-shadow: 0 2px 4px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #line1 { text-align: left; }
        #line2 { text-align: right; margin-top: 8px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
<div id="root">
    <video id="vid" playsinline crossorigin="anonymous" disablePictureInPicture controlslist="nodownload noplaybackrate noremoteplayback"></video>
    <div id="topbar">
        <div id="status">連線中...</div>
        <div>
            <button id="skipIntro" class="btn" style="display:none;">⏩ 跳過前奏</button>
            <button id="fsBtn" class="btn">⛶ 全螢幕</button>
        </div>
    </div>
    <div id="lyrics">
        <div id="countdown"></div>
        <div id="line1">　</div>
        <div id="line2">　</div>
    </div>
</div>

<script>
const socket = io();
const video = document.getElementById('vid');
const statusEl = document.getElementById('status');
const skipBtn = document.getElementById('skipIntro');
const fsBtn = document.getElementById('fsBtn');

let internalSeek = false;
let authoritative = { status: 'stopped', position: 0, intro_skip_at: null, current_song: null };
let audioReady = false;

function nowPos(snapshot) {
    if (!snapshot) return 0;
    let p = snapshot.position || 0;
    if (snapshot.status === 'playing' && snapshot.server_time) {
        p += Math.max(0, Date.now() / 1000 - snapshot.server_time);
    }
    return p;
}

function tryEnableAudio() {
    if (audioReady) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) {
        const ctx = new Ctx();
        if (ctx.state === 'suspended') ctx.resume();
    }
    audioReady = true;
}

document.addEventListener('click', tryEnableAudio, { once: true });
document.addEventListener('touchstart', tryEnableAudio, { once: true });

function applySnapshot(snapshot) {
    authoritative = snapshot;
    const target = nowPos(snapshot);
    const drift = Math.abs((video.currentTime || 0) - target);

    if (snapshot.current_song) {
        statusEl.innerText = `播放中: ${snapshot.current_song.replace('.mp4','')} (${snapshot.status})`;
    } else {
        statusEl.innerText = '待機中';
    }

    if (snapshot.intro_skip_at !== null && snapshot.intro_skip_at !== undefined && target < snapshot.intro_skip_at) {
        skipBtn.style.display = 'inline-block';
    } else {
        skipBtn.style.display = 'none';
    }

    if (snapshot.status === 'playing' && video.paused && video.src) {
        video.play().catch(() => {});
    }
    if (snapshot.status === 'paused' && !video.paused) {
        video.pause();
    }
    if (drift > 0.45 && video.src) {
        internalSeek = true;
        video.currentTime = target;
        setTimeout(() => { internalSeek = false; }, 80);
    }
}

socket.on('connect', () => {
    statusEl.innerText = '已連線，等待同步';
    socket.emit('register_client', { role: 'player' });
    socket.emit('request_state');
});

socket.on('play_video', (data) => {
    const newSrc = '/songs/' + encodeURIComponent(data.filename) + '?t=' + Date.now();
    if (!video.src.includes(encodeURIComponent(data.filename))) {
        video.src = newSrc;
    }
    const seekTo = Number(data.start_at || 0);
    internalSeek = true;
    video.currentTime = seekTo;
    setTimeout(() => { internalSeek = false; }, 80);
    video.play().catch(() => {
        statusEl.innerText = '請點擊頁面啟用音訊';
    });
});

socket.on('stop_video', () => {
    video.pause();
    video.removeAttribute('src');
    video.load();
    statusEl.innerText = '已停止';
    skipBtn.style.display = 'none';
});

socket.on('command', (cmd) => {
    if (!cmd || !cmd.action) return;
    if (cmd.action === 'pause_toggle') {
        if (video.paused) video.play().catch(() => {}); else video.pause();
    }
    if (cmd.action === 'seek') {
        internalSeek = true;
        video.currentTime = Number(cmd.position || 0);
        setTimeout(() => { internalSeek = false; }, 80);
    }
});

socket.on('playback_snapshot', applySnapshot);

video.onended = () => {
    socket.emit('song_ended', {});
};

video.addEventListener('seeking', () => {
    if (internalSeek) return;
    internalSeek = true;
    video.currentTime = nowPos(authoritative);
    setTimeout(() => { internalSeek = false; }, 80);
});

skipBtn.onclick = () => socket.emit('skip_intro');

fsBtn.onclick = () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    } else {
        (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
    }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>KTV 播放螢幕</title>
    <style>
        body { background: #000; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; font-family: Arial; }
        video { width: 100%; height: 100%; object-fit: contain; }
        #overlay { position: absolute; top: 20px; left: 20px; font-size: 24px; text-shadow: 2px 2px 4px #000; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;}
        #waiting { font-size: 50px; color: #555; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div id="overlay">等待連線...</div>
    <div id="waiting" onclick="initAudioContext()">📺 KTV 準備就緒 (點我啟動音效)</div>
    <video id="vid" playsinline crossorigin="anonymous"></video>
    <audio id="instrumental" preload="auto" crossorigin="anonymous"></audio>

    <script>
        const socket = io();
        const video = document.getElementById('vid');
        const overlay = document.getElementById('overlay');
        const waiting = document.getElementById('waiting');
        
        let audioCtx, source, instrumentalSource, originalGain, instrumentalGain, masterGain;
        let isAudioSetup = false;
        let currentMode = 'original';
        let instrumentalAvailable = false;

        function initAudioContext() {
            if(!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if(audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            waiting.innerText = "🔊 音效引擎已啟動，等待點歌...";
            waiting.style.color = "#4CAF50";
        }

        function setupAudio() {
            if(isAudioSetup) return;
            if(!audioCtx) initAudioContext();

            const instrumental = document.getElementById('instrumental');
            source = audioCtx.createMediaElementSource(video);
            instrumentalSource = audioCtx.createMediaElementSource(instrumental);
            originalGain = audioCtx.createGain();
            instrumentalGain = audioCtx.createGain();
            masterGain = audioCtx.createGain();

            source.connect(originalGain).connect(masterGain);
            instrumentalSource.connect(instrumentalGain).connect(masterGain);
            masterGain.connect(audioCtx.destination);
            
            isAudioSetup = true;
            setAudioMode(currentMode);
        }

        socket.on('connect', () => { overlay.innerText = "✅ 已連線主機"; });

        socket.on('playback_state', (data) => {
            const instrumental = document.getElementById('instrumental');
            currentMode = data.audio_mode || 'original';
            if (!data.filename) {
                video.pause();
                instrumental.pause();
                waiting.style.display = 'block';
                return;
            }

            const isNewSong = video.dataset.filename !== data.filename;
            if (isNewSong) {
                video.dataset.filename = data.filename;
                video.src = "/songs/" + encodeURIComponent(data.filename);
                instrumentalAvailable = Boolean(data.instrumental_filename);
                instrumental.src = instrumentalAvailable ? "/songs/" + encodeURIComponent(data.instrumental_filename) : "";
                waiting.style.display = 'none';
            }

            const sync = () => {
                const target = Math.max(0, Number(data.position) || 0);
                const align = (media) => {
                    const drift = target - media.currentTime;
                    if (Math.abs(drift) > 0.35) {
                        media.currentTime = target;
                        media.playbackRate = 1;
                    } else {
                        media.playbackRate = 1 + Math.max(-0.05, Math.min(0.05, drift * 0.12));
                    }
                };
                align(video);
                if (instrumentalAvailable) align(instrumental);
                if (!isAudioSetup) setupAudio();
                setAudioMode(currentMode);
                if (data.is_playing) {
                    video.play().catch(() => {});
                    if (instrumentalAvailable && currentMode === 'instrumental') instrumental.play().catch(() => {});
                } else {
                    video.pause();
                    instrumental.pause();
                }
            };
            if (isNewSong) video.onloadedmetadata = sync; else sync();
        });

        socket.on('play_video', (data) => {
            waiting.style.display = 'none';
            overlay.innerText = "正在播放: " + data.title;
            video.src = "/songs/" + encodeURIComponent(data.filename) + "?t=" + new Date().getTime();
            video.play().then(() => {
                if(!isAudioSetup) setupAudio();
                setAudioMode('original'); 
            }).catch(e => {
                overlay.innerText = "⚠️ 請點擊畫面開始播放";
            });
        });

        socket.on('command', (cmd) => {
            if (cmd === 'pause') video.paused ? video.play() : video.pause();
            if (cmd === 'stop') {
                video.pause();
                video.src = "";
                waiting.style.display = 'block';
                overlay.innerText = "⏹ 已停止";
            }
        });

        video.onended = function() { socket.emit('song_ended', {filename: video.dataset.filename}); };

        socket.on('set_audio', (mode) => {
            currentMode = mode;
            setAudioMode(mode);
        });

        function setAudioMode(mode) {
            if(!isAudioSetup || !originalGain || !instrumentalGain) return;
            const now = audioCtx.currentTime;
            if (mode === 'original') { 
                originalGain.gain.setTargetAtTime(1, now, 0.1);
                instrumentalGain.gain.setTargetAtTime(0, now, 0.1);
                document.getElementById('instrumental').pause();
                overlay.innerText = "🎤 目前模式：原唱";
            } else if (mode === 'instrumental') { 
                originalGain.gain.setTargetAtTime(0, now, 0.1);
                instrumentalGain.gain.setTargetAtTime(1, now, 0.1);
                if (instrumentalAvailable) {
                    const instrumental = document.getElementById('instrumental');
                    instrumental.currentTime = video.currentTime;
                    if (!video.paused) instrumental.play().catch(() => {});
                }
                overlay.innerText = "🚫 目前模式：伴奏";
            } else { 
                originalGain.gain.setTargetAtTime(1, now, 0.1);
                instrumentalGain.gain.setTargetAtTime(0, now, 0.1);
                overlay.innerText = "🎵 目前模式：立體聲";
            }
        }
        document.body.addEventListener('click', initAudioContext);
    </script>
</body>
</html>

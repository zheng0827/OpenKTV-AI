<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KTV Player</title>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:Arial,sans-serif; overflow:hidden; }
        #root { position:relative; width:100vw; height:100vh; }
        video { width:100%; height:100%; object-fit:contain; background:#000; }
        #overlay { position:absolute; left:16px; top:16px; background:rgba(0,0,0,.55); border-radius:8px; padding:8px 12px; font-size:18px; z-index:5; }
        #full-btn { position:absolute; right:16px; top:16px; z-index:6; border:1px solid #fff; border-radius:8px; padding:8px 12px; background:rgba(0,0,0,.4); color:#fff; }
        #waiting { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#aaa; font-size:26px; z-index:4; }
        #subtitle-panel { position:absolute; left:6%; right:6%; bottom:20px; z-index:6; pointer-events:none; }
        .line { font-size:38px; font-weight:700; line-height:1.35; text-shadow:0 2px 8px rgba(0,0,0,.75); white-space:pre-wrap; }
        #line-top { text-align:left; margin-bottom:8px; }
        #line-bottom { text-align:right; color:#f5f5f5; }
        .word { color:#fff; transition:color .1s linear; }
        .word.active { color:#1e88e5; }
        .countdown { color:#64b5f6; letter-spacing:3px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
<div id="root">
    <video id="video" playsinline crossorigin="anonymous"></video>
    <audio id="instrumental" preload="auto" crossorigin="anonymous"></audio>
    <div id="overlay">等待同步...</div>
    <button id="full-btn" onclick="toggleFullscreen()">⛶ 全螢幕</button>
    <div id="waiting">📺 等待點歌</div>

    <div id="subtitle-panel">
        <div id="line-top" class="line"></div>
        <div id="line-bottom" class="line"></div>
    </div>
</div>

<script>
const socket = io({ query: { role: 'player' } });
const video = document.getElementById('video');
const instrumental = document.getElementById('instrumental');
const overlay = document.getElementById('overlay');
const waiting = document.getElementById('waiting');
const lineTop = document.getElementById('line-top');
const lineBottom = document.getElementById('line-bottom');

let audioCtx, videoSource, instSource, originalGain, instGain, masterGain;
let audioReady = false;
let activeMode = 'original';
let instrumentalAvailable = false;
let lyricLines = [];
let lineA = null;
let lineB = null;
let countdownAnchors = [];

function initAudio() {
    if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (audioReady) return;

    videoSource = audioCtx.createMediaElementSource(video);
    instSource = audioCtx.createMediaElementSource(instrumental);
    originalGain = audioCtx.createGain();
    instGain = audioCtx.createGain();
    masterGain = audioCtx.createGain();

    videoSource.connect(originalGain).connect(masterGain);
    instSource.connect(instGain).connect(masterGain);
    masterGain.connect(audioCtx.destination);
    audioReady = true;
}

function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
}

function syncElement(media, target) {
    const drift = target - media.currentTime;
    if (Math.abs(drift) > 0.3) {
        media.currentTime = target;
        media.playbackRate = 1;
    } else {
        media.playbackRate = 1 + Math.max(-0.05, Math.min(0.05, drift * 0.15));
    }
}

function updateMode(mode) {
    if (!audioReady) return;
    const now = audioCtx.currentTime;
    if (mode === 'instrumental') {
        const hasInstrumental = instrumentalAvailable && Boolean(instrumental.src);
        originalGain.gain.setTargetAtTime(hasInstrumental ? 0.0 : 1.0, now, 0.08);
        instGain.gain.setTargetAtTime(hasInstrumental ? 1.0 : 0.0, now, 0.08);
        if (instrumentalAvailable && !video.paused) instrumental.play().catch(() => {});
        overlay.innerText = '🚫 伴奏模式';
    } else {
        originalGain.gain.setTargetAtTime(1.0, now, 0.08);
        instGain.gain.setTargetAtTime(0, now, 0.08);
        overlay.innerText = '🎤 原唱模式';
    }
}

function parseKtvLrc(text) {
    const lines = [];
    let current = null;
    for (const raw of text.split(/\r?\n/)) {
        const line = raw.trim();
        if (!line || line.startsWith('@')) continue;
        if (line.startsWith('%')) {
            const m = line.match(/^%(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+(.+)$/);
            if (!m) continue;
            current = { start:Number(m[1]), end:Number(m[2]), text:m[3], words:[] };
            lines.push(current);
        } else if (line.startsWith('$') && current) {
            const m = line.match(/^\$(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+(.+)$/);
            if (!m) continue;
            current.words.push({ start:Number(m[1]), end:Number(m[2]), text:m[3] });
        }
    }
    return lines;
}

function buildCountdownAnchors(lines) {
    const anchors = [];
    let lastAnchor = -999;
    for (let i = 0; i < lines.length; i++) {
        const start = lines[i].start;
        if (i === 0 || start - lastAnchor >= 20) {
            anchors.push(start);
            lastAnchor = start;
        }
    }
    return anchors;
}

async function loadLyricsForSong(filename) {
    lyricLines = [];
    lineA = null;
    lineB = null;
    countdownAnchors = [];
    try {
        const lrcName = filename.replace(/\.mp4$/i, '.lrc');
        const resp = await fetch(`/songs/${encodeURIComponent(lrcName)}`);
        if (!resp.ok) throw new Error('missing lrc');
        const text = await resp.text();
        lyricLines = parseKtvLrc(text);
        countdownAnchors = buildCountdownAnchors(lyricLines);
    } catch (_) {
        lyricLines = [];
        countdownAnchors = [];
    }
}

function countdownText(now) {
    for (const anchor of countdownAnchors) {
        const remain = anchor - now;
        if (remain <= 3 && remain > 0) {
            const dots = Math.ceil(remain);
            return `<span class="countdown">${'●'.repeat(Math.max(1, Math.min(3, dots)))}</span>`;
        }
    }
    return '';
}

function renderLine(line, now) {
    if (!line) return '';
    if (!line.words || !line.words.length) return `<span class="word active">${line.text}</span>`;
    return line.words.map(w => `<span class="word ${now >= w.end ? 'active' : ''}">${w.text}</span>`).join('');
}

function updateLyrics(now) {
    if (!lyricLines.length) {
        lineTop.innerHTML = countdownText(now);
        lineBottom.innerHTML = '';
        return;
    }

    lineA = null;
    lineB = null;
    for (let i = lyricLines.length - 1; i >= 0; i--) {
        if (!lineA && i % 2 === 0 && now >= lyricLines[i].start) lineA = lyricLines[i];
        if (!lineB && i % 2 === 1 && now >= lyricLines[i].start) lineB = lyricLines[i];
        if (lineA && lineB) break;
    }

    const topCountdown = countdownText(now);
    lineTop.innerHTML = `${topCountdown}${renderLine(lineA, now)}`;
    lineBottom.innerHTML = renderLine(lineB, now);
}

function handleSnapshot(snapshot) {
    initAudio();
    activeMode = snapshot.audio_mode || 'original';

    if (!snapshot.filename) {
        waiting.style.display = 'flex';
        video.pause();
        instrumental.pause();
        lineTop.innerHTML = '';
        lineBottom.innerHTML = '';
        return;
    }

    const isNewSong = video.dataset.filename !== snapshot.filename;
    if (isNewSong) {
        video.dataset.filename = snapshot.filename;
        video.src = `/songs/${encodeURIComponent(snapshot.filename)}`;
        instrumentalAvailable = Boolean(snapshot.instrumental_filename);
        instrumental.src = instrumentalAvailable ? `/songs/${encodeURIComponent(snapshot.instrumental_filename)}` : '';
        loadLyricsForSong(snapshot.filename);
    }

    waiting.style.display = 'none';
    const target = Math.max(0, Number(snapshot.position) || 0);
    const sync = () => {
        syncElement(video, target);
        if (instrumentalAvailable) syncElement(instrumental, target);
        updateMode(activeMode);
        if (snapshot.effects && snapshot.effects.volume !== undefined && masterGain) {
            masterGain.gain.setTargetAtTime(Number(snapshot.effects.volume), audioCtx.currentTime, 0.08);
        }
        if (snapshot.is_playing) {
            video.play().catch(() => {});
            if (instrumentalAvailable && activeMode === 'instrumental') instrumental.play().catch(() => {});
        } else {
            video.pause();
            instrumental.pause();
        }
        updateLyrics(target);
    };

    if (isNewSong) video.onloadedmetadata = sync;
    else sync();
}

socket.on('connect', () => { overlay.innerText = '✅ 已連線'; });
socket.on('playback_snapshot', handleSnapshot);
socket.on('playback_state', handleSnapshot);

setInterval(() => {
    if (!video.paused) updateLyrics(video.currentTime);
}, 80);

video.onended = () => socket.emit('song_ended', { filename: video.dataset.filename });
document.addEventListener('click', () => initAudio(), { once:true });
</script>
</body>
</html>

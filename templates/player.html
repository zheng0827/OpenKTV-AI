<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KTV 播放螢幕</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
        #viewport { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        #overlay { position: absolute; left: 16px; top: 16px; background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px; font-size: 18px; }
        #full-btn { position: absolute; right: 16px; top: 16px; border: 1px solid #fff; background: rgba(0,0,0,0.35); color: #fff; padding: 8px 12px; border-radius: 6px; }
        #skip-intro { position: absolute; right: 16px; bottom: 128px; border: 0; border-radius: 999px; background: #2e7d32; color: #fff; padding: 12px 18px; display: none; }
        #waiting { position: absolute; text-align: center; color: #bbb; font-size: 24px; }
        #subtitle-panel { position: absolute; left: 6%; right: 6%; bottom: 18px; min-height: 84px; padding: 10px 14px; background: rgba(0,0,0,0.38); border-radius: 10px; }
        #subtitle-top { text-align: left; font-size: 28px; line-height: 1.3; }
        #subtitle-bottom { text-align: right; font-size: 28px; line-height: 1.3; color: #cfd8dc; }
        .countdown { letter-spacing: 2px; color: #64b5f6; font-weight: 700; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div id="viewport">
        <div id="overlay">等待伺服器同步...</div>
        <button id="full-btn" onclick="toggleFullscreen()">⛶ 全螢幕</button>
        <button id="skip-intro" disabled>前奏可略過（請用遙控器操作）</button>
        <div id="waiting">📺 等待點歌中</div>

        <video id="video" playsinline crossorigin="anonymous"></video>
        <audio id="instrumental" preload="auto" crossorigin="anonymous"></audio>

        <div id="subtitle-panel">
            <div id="subtitle-top"><span class="countdown">●●●</span></div>
            <div id="subtitle-bottom"></div>
        </div>
    </div>

    <script>
        const socket = io({ query: { role: 'player' } });
        const video = document.getElementById('video');
        const instrumental = document.getElementById('instrumental');
        const overlay = document.getElementById('overlay');
        const waiting = document.getElementById('waiting');
        const skipButton = document.getElementById('skip-intro');

        let audioCtx, videoSource, instrumentalSource, originalGain, backingGain, masterGain;
        let audioReady = false;
        let instrumentalAvailable = false;
        let activeMode = 'original';

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (audioReady) return;

            videoSource = audioCtx.createMediaElementSource(video);
            instrumentalSource = audioCtx.createMediaElementSource(instrumental);
            originalGain = audioCtx.createGain();
            backingGain = audioCtx.createGain();
            masterGain = audioCtx.createGain();

            videoSource.connect(originalGain).connect(masterGain);
            instrumentalSource.connect(backingGain).connect(masterGain);
            masterGain.connect(audioCtx.destination);
            audioReady = true;
        }

        function toggleFullscreen() {
            const root = document.documentElement;
            if (!document.fullscreenElement) root.requestFullscreen?.();
            else document.exitFullscreen?.();
        }

        function syncMediaElement(media, targetPosition) {
            const drift = targetPosition - media.currentTime;
            if (Math.abs(drift) > 0.3) {
                media.currentTime = targetPosition;
                media.playbackRate = 1;
                return;
            }
            media.playbackRate = 1 + Math.max(-0.05, Math.min(0.05, drift * 0.15));
        }

        function updateMode(mode) {
            if (!audioReady) return;
            const now = audioCtx.currentTime;
            if (mode === 'instrumental') {
                originalGain.gain.setTargetAtTime(0.25, now, 0.08);
                backingGain.gain.setTargetAtTime(1.0, now, 0.08);
                if (instrumentalAvailable && !video.paused) instrumental.play().catch(() => {});
                overlay.innerText = '🚫 伴奏模式';
            } else {
                originalGain.gain.setTargetAtTime(1.0, now, 0.08);
                backingGain.gain.setTargetAtTime(0.0, now, 0.08);
                overlay.innerText = '🎤 原唱模式';
            }
        }

        function updateIntroButton(snapshot) {
            const hideAfter = Number(snapshot.intro_skip_hide_after);
            const skipTo = Number(snapshot.intro_skip_to);
            const current = Number(snapshot.position || 0);
            const canShow = Number.isFinite(skipTo) && Number.isFinite(hideAfter) && current < hideAfter && !snapshot.intro_skip_used;
            skipButton.style.display = canShow ? 'block' : 'none';
            if (canShow) {
                skipButton.textContent = `前奏可跳至 ${skipTo.toFixed(1)}s（請用遙控器）`;
            }
        }

        function handleSnapshot(snapshot) {
            initAudio();
            activeMode = snapshot.audio_mode || 'original';

            if (!snapshot.filename) {
                waiting.style.display = 'block';
                video.pause();
                instrumental.pause();
                return;
            }

            const currentFile = video.dataset.filename;
            const isNewSong = currentFile !== snapshot.filename;
            if (isNewSong) {
                video.dataset.filename = snapshot.filename;
                video.src = `/songs/${encodeURIComponent(snapshot.filename)}`;
                instrumentalAvailable = Boolean(snapshot.instrumental_filename);
                instrumental.src = instrumentalAvailable ? `/songs/${encodeURIComponent(snapshot.instrumental_filename)}` : '';
            }

            waiting.style.display = 'none';
            const target = Math.max(0, Number(snapshot.position) || 0);

            const syncAction = () => {
                syncMediaElement(video, target);
                if (instrumentalAvailable) syncMediaElement(instrumental, target);
                updateMode(activeMode);

                if (snapshot.effects && masterGain) {
                    if (snapshot.effects.volume !== undefined) {
                        masterGain.gain.setTargetAtTime(Number(snapshot.effects.volume), audioCtx.currentTime, 0.08);
                    }
                }

                if (snapshot.is_playing) {
                    video.play().catch(() => {});
                    if (instrumentalAvailable && activeMode === 'instrumental') instrumental.play().catch(() => {});
                } else {
                    video.pause();
                    instrumental.pause();
                }
            };

            if (isNewSong) video.onloadedmetadata = syncAction;
            else syncAction();

            updateIntroButton(snapshot);
        }

        socket.on('connect', () => {
            overlay.innerText = '✅ 已連線，等待同步';
        });

        socket.on('playback_snapshot', handleSnapshot);
        socket.on('playback_state', handleSnapshot);

        video.onended = () => {
            socket.emit('song_ended', { filename: video.dataset.filename });
        };

        document.addEventListener('click', () => initAudio(), { once: true });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTV Admin</title>
    <style>
        body { background: #f4f4f9; color: #333; font-family: sans-serif; padding: 20px; max-width: 820px; margin: auto; }
        .card { background: white; padding: 18px; border-radius: 10px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        input, select, button, textarea { width: 100%; box-sizing: border-box; margin-top: 8px; }
        input, select { border: 1px solid #ccc; border-radius: 6px; padding: 9px; }
        button { border: 0; border-radius: 6px; padding: 10px; color: #fff; font-weight: 700; cursor: pointer; }
        .primary { background: #f57c00; }
        .secondary { background: #546e7a; }
        textarea { border-radius: 6px; background: #111; color: #00e676; min-height: 180px; padding: 10px; }
        .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .links a { text-decoration: none; text-align: center; background: #455a64; color: #fff; padding: 9px; border-radius: 6px; }
        .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.45); }
        .modal .inner { width: min(760px, 95vw); max-height: 80vh; overflow: auto; background: #fff; border-radius: 10px; padding: 14px; }
        .playlist-item { display: flex; gap: 10px; margin-bottom: 8px; padding: 8px; border: 1px solid #ddd; border-radius: 8px; }
        .muted { color: #777; font-size: 13px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="links">
        <a href="/player">播放端</a>
        <a href="/remote">遙控端</a>
        <a href="/queue">Queue 管理</a>
    </div>

    <div class="card">
        <h3>新增歌曲 / Playlist</h3>
        <label>YouTube 連結（單曲或 playlist）</label>
        <input id="yt_url" placeholder="https://www.youtube.com/watch?v=... 或 ...&list=...">

        <label>自訂標題（單曲時可填）</label>
        <input id="yt_title" placeholder="歌手 - 歌名">
        <button class="secondary" onclick="resolveTitleFromYoutube()">從 YouTube 標題自動解析歌手/歌名</button>

        <label>分離後端</label>
        <select id="separator_backend">
            <option value="demucs">Demucs</option>
            <option value="uvr">UVR</option>
            <option value="hybrid">Hybrid（Demucs伴奏 + UVR人聲）</option>
        </select>

        <label>Demucs stems</label>
        <select id="stems_mode">
            <option value="4">4 stems（預設）</option>
            <option value="2">2 stems</option>
        </select>

        <label>歌詞對齊後端</label>
        <select id="alignment_backend">
            <option value="ctc">CTC</option>
            <option value="whisperx">WhisperX</option>
            <option value="qwen">Qwen</option>
        </select>

        <label>Device</label>
        <select id="device_mode">
            <option value="auto">auto (CUDA→CPU fallback)</option>
            <option value="cuda">cuda</option>
            <option value="cpu">cpu</option>
        </select>

        <button id="btnPreview" class="secondary" onclick="previewPlaylist()">預覽 Playlist 曲目</button>
        <button id="btnStart" class="primary" onclick="startDownload()">開始處理</button>
        <p class="muted">流程：下載影片 → 分離 → lrclib 歌詞 → 對齊 → 對白切分 → 輸出 mp4 / instrumental.m4a / lyrics.vocals.wav。</p>
    </div>

    <div class="card">
        <h3>任務進度</h3>
        <div id="progress">尚未開始</div>
    </div>

    <div class="card">
        <h3>系統日誌</h3>
        <textarea id="log" readonly></textarea>
        <button class="secondary" onclick="socket.emit('update_ytdlp')" style="margin-top:8px;">更新 yt-dlp</button>
    </div>

    <div id="playlistModal" class="modal">
        <div class="inner">
            <h3>Playlist 選歌</h3>
            <div id="playlistItems"></div>
            <button class="primary" onclick="confirmPlaylistSelection()">使用勾選曲目</button>
            <button class="secondary" onclick="closeModal('playlistModal')">取消</button>
        </div>
    </div>

    <div id="lyricsModal" class="modal">
        <div class="inner">
            <h3>歌詞資訊確認</h3>
            <label>歌曲名稱</label>
            <input id="lyricSongName">
            <label>歌手</label>
            <input id="lyricSinger">
        <label>完整歌詞（可貼上；空白則自動嘗試 lrclib）</label>
        <textarea id="lyricText" style="min-height:140px;color:#222;background:#fafafa;"></textarea>
        <button class="primary" onclick="confirmSingleWithLyrics()">確認並開始</button>
        <button class="secondary" onclick="closeModal('lyricsModal')">取消</button>
    </div>
    </div>

    <script>
        const socket = io({ query: { role: 'admin' } });
        const logArea = document.getElementById('log');
        let playlistSelection = [];
        let pendingSingle = null;

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }

        function isPlaylistUrl(url) {
            try {
                const parsed = new URL(url);
                return parsed.searchParams.has('list') || parsed.pathname.includes('/playlist');
            } catch (_) {
                return false;
            }
        }

        async function previewPlaylist() {
            const url = document.getElementById('yt_url').value.trim();
            if (!url || !isPlaylistUrl(url)) {
                alert('請先輸入 playlist 連結');
                return;
            }
            const resp = await fetch(`/api/playlist_preview?url=${encodeURIComponent(url)}`);
            const data = await resp.json();
            if (!data.ok) {
                alert(data.error || '讀取失敗');
                return;
            }
            const items = document.getElementById('playlistItems');
            items.innerHTML = '';
            data.entries.forEach((entry, idx) => {
                const row = document.createElement('div');
                row.className = 'playlist-item';
                row.innerHTML = `<input type="checkbox" id="pl_${idx}" checked>
                                 <label for="pl_${idx}" style="flex:1;">${entry.title}</label>`;
                row.dataset.payload = JSON.stringify(entry);
                items.appendChild(row);
            });
            openModal('playlistModal');
        }

        function confirmPlaylistSelection() {
            playlistSelection = [];
            document.querySelectorAll('#playlistItems .playlist-item').forEach((row, idx) => {
                const checked = row.querySelector('input').checked;
                if (checked) playlistSelection.push(JSON.parse(row.dataset.payload));
            });
            closeModal('playlistModal');
            startDownload(true);
        }

        function splitArtistTitle(text) {
            if (!text) return { singer: '', song: '' };
            const part = text.split(' - ');
            if (part.length > 1) return { singer: part[0].trim(), song: part.slice(1).join(' - ').trim() };
            return { singer: '', song: text.trim() };
        }

        function startDownload(fromPlaylistSelection = false) {
            const url = document.getElementById('yt_url').value.trim();
            const title = document.getElementById('yt_title').value.trim();
            if (!url) { alert('請輸入連結'); return; }

            if (!fromPlaylistSelection && !isPlaylistUrl(url)) {
                pendingSingle = { url, title };
                const info = splitArtistTitle(title);
                document.getElementById('lyricSongName').value = info.song;
                document.getElementById('lyricSinger').value = info.singer;
                openModal('lyricsModal');
                return;
            }

            emitStart(url, title, fromPlaylistSelection ? playlistSelection : null);
        }

        function confirmSingleWithLyrics() {
            if (!pendingSingle) return;
            const singer = document.getElementById('lyricSinger').value.trim();
            const song = document.getElementById('lyricSongName').value.trim();
            const lyricText = document.getElementById('lyricText').value || '';
            const mergedTitle = singer ? `${singer} - ${song}` : song;
            closeModal('lyricsModal');
            emitStart(pendingSingle.url, mergedTitle || pendingSingle.title, null, singer, lyricText);
            pendingSingle = null;
        }

        function emitStart(url, title, playlistEntries, singer = '', lyricsText = '') {
            socket.emit('start_download', {
                url,
                title,
                stems: document.getElementById('stems_mode').value,
                device: document.getElementById('device_mode').value,
                separator_backend: document.getElementById('separator_backend').value,
                alignment_backend: document.getElementById('alignment_backend').value,
                playlist_entries: playlistEntries,
                singer,
                lyrics_text: lyricsText,
            });
        }

        socket.on('admin_log', ({ msg }) => {
            logArea.value += `${msg}\n`;
            logArea.scrollTop = logArea.scrollHeight;
        });

        socket.on('task_status', ({ status }) => {
            const disabled = status === 'busy';
            document.getElementById('btnStart').disabled = disabled;
            document.getElementById('btnPreview').disabled = disabled;
        });

        socket.on('task_progress', (data) => {
            const area = document.getElementById('progress');
            if (data.phase === 'done') {
                area.innerText = `完成：成功 ${data.success}/${data.total}，失敗 ${data.failed.length}`;
                return;
            }
            area.innerText = `處理中 ${data.current}/${data.total}：${data.title}（第 ${data.attempt} 次）`;
        });

        async function resolveTitleFromYoutube() {
            const url = document.getElementById('yt_url').value.trim();
            if (!url) { alert('請先輸入 YouTube 連結'); return; }
            const resp = await fetch(`/api/resolve_yt_title?url=${encodeURIComponent(url)}`);
            const data = await resp.json();
            if (!data.ok) {
                alert(data.error || '解析失敗');
                return;
            }
            const mergedTitle = data.singer ? `${data.singer} - ${data.song}` : data.song;
            document.getElementById('yt_title').value = mergedTitle;
            document.getElementById('lyricSongName').value = data.song || '';
            document.getElementById('lyricSinger').value = data.singer || '';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTV 系統管理</title>
    <style>
        body { background: #f4f4f9; color: #333; font-family: sans-serif; padding: 20px; max-width: 860px; margin: auto; }
        .card { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
        input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0 12px; border-radius: 6px; border: 1px solid #ccc; }
        button { border: 0; border-radius: 6px; padding: 10px 14px; color: #fff; font-weight: bold; cursor: pointer; }
        .primary { background: #FF9800; }
        .secondary { background: #607D8B; }
        textarea { height: 220px; background: #222; color: #0f0; font-family: monospace; }
        .nav a { text-decoration: none; color: #fff; background: #455A64; padding: 8px 10px; border-radius: 8px; margin-right: 6px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal .box { width: min(900px, 95vw); max-height: 88vh; overflow: auto; background: #fff; border-radius: 10px; padding: 16px; }
        .row { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
        .row:last-child { border-bottom: 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="nav" style="margin-bottom:12px;">
        <a href="/remote">📱 遙控器</a>
        <a href="/queue">📋 Queue</a>
        <a href="/player">📺 播放端</a>
    </div>

    <div class="card">
        <h3>新增歌曲（單曲 / 播放清單）</h3>
        <label>YouTube URL</label>
        <input id="yt_url" placeholder="https://www.youtube.com/watch?v=... 或 playlist 連結" />

        <label>Demucs stems</label>
        <select id="stems">
            <option value="4" selected>4 stems (default)</option>
            <option value="2">2 stems</option>
        </select>

        <button class="primary" onclick="analyzeInput()">分析連結</button>
    </div>

    <div class="card">
        <h3>系統維護</h3>
        <button class="secondary" onclick="updateYtDlp()">更新 yt-dlp</button>
    </div>

    <div class="card">
        <h3>系統日誌</h3>
        <textarea id="log" readonly></textarea>
    </div>

    <div id="playlistModal" class="modal">
        <div class="box">
            <h3>選擇要下載的 Playlist 曲目</h3>
            <div id="playlistBody"></div>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
                <button style="background:#757575;" onclick="closePlaylistModal()">取消</button>
                <button class="primary" onclick="startPlaylistDownload()">開始下載</button>
            </div>
        </div>
    </div>

    <div id="lyricModal" class="modal">
        <div class="box">
            <h3>確認歌詞（LRCLIB plain lyrics）</h3>
            <div id="singleMeta" style="margin-bottom:8px;color:#666;"></div>
            <label>歌名</label>
            <input id="singleTitle" />
            <label>歌手</label>
            <input id="singleArtist" />
            <label>歌詞 (plain)</label>
            <textarea id="singleLyrics" style="height:180px;background:#f8f8f8;color:#222;"></textarea>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
                <button style="background:#757575;" onclick="closeLyricModal()">取消</button>
                <button class="primary" onclick="startSingleDownload()">開始製作</button>
            </div>
        </div>
    </div>

<script>
const socket = io();
const logArea = document.getElementById('log');
let pendingPlaylist = [];
let pendingSingle = null;

socket.on('connect', () => socket.emit('register_client', { role: 'admin' }));
socket.on('admin_log', d => { logArea.value += d.msg + '\n'; logArea.scrollTop = logArea.scrollHeight; });
socket.on('task_progress', d => { logArea.value += `[${d.current}/${d.total}] ${d.title} (attempt ${d.attempt})\n`; logArea.scrollTop = logArea.scrollHeight; });
socket.on('task_status', d => { logArea.value += `status: ${d.status} ${d.message || ''}\n`; logArea.scrollTop = logArea.scrollHeight; });

function analyzeInput() {
    const url = document.getElementById('yt_url').value.trim();
    if (!url) return alert('請輸入 URL');
    socket.emit('analyze_input', { url });
}

socket.on('analyze_result', (res) => {
    if (!res.ok) return alert(res.error || '分析失敗');
    if (res.mode === 'playlist') {
        pendingPlaylist = res.entries || [];
        const body = document.getElementById('playlistBody');
        body.innerHTML = '';
        pendingPlaylist.forEach((e, i) => {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `<input type="checkbox" id="pl_${i}" checked><label for="pl_${i}">${e.title}</label>`;
            body.appendChild(row);
        });
        document.getElementById('playlistModal').style.display = 'flex';
    } else {
        pendingSingle = res.item;
        document.getElementById('singleMeta').innerText = `來源: ${res.item.url}`;
        document.getElementById('singleTitle').value = res.item.title || '';
        document.getElementById('singleArtist').value = res.item.artist || '';
        document.getElementById('singleLyrics').value = res.item.lyrics_plain || '';
        document.getElementById('lyricModal').style.display = 'flex';
    }
});

function closePlaylistModal(){ document.getElementById('playlistModal').style.display = 'none'; }
function closeLyricModal(){ document.getElementById('lyricModal').style.display = 'none'; }

function startPlaylistDownload() {
    const selected = pendingPlaylist.filter((_, i) => document.getElementById(`pl_${i}`).checked);
    if (!selected.length) return alert('請至少選一首');
    socket.emit('start_download', {
        mode: 'playlist',
        stems: Number(document.getElementById('stems').value || 4),
        entries: selected,
    });
    closePlaylistModal();
}

function startSingleDownload() {
    const title = document.getElementById('singleTitle').value.trim();
    const artist = document.getElementById('singleArtist').value.trim();
    const plain = document.getElementById('singleLyrics').value;
    socket.emit('start_download', {
        mode: 'single',
        stems: Number(document.getElementById('stems').value || 4),
        url: pendingSingle.url,
        title,
        lyrics: {
            plain,
            synced: pendingSingle.lyrics_synced || '',
            song: title,
            artist,
            album: pendingSingle.album || '',
        },
    });
    closeLyricModal();
}

function updateYtDlp() { socket.emit('update_ytdlp'); }
</script>
</body>
</html>

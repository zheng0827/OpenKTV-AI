<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KTV 遙控器</title>
    <style>
        body { background: #131313; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 12px; }
        .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
        .btn { border: 0; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 700; color: #fff; }
        .pause { background: #1976d2; }
        .stop { background: #c62828; }
        .vocal { background: #ef6c00; }
        .inst { background: #fbc02d; color: #111; }
        .skip { background: #2e7d32; display: none; }
        .link { display: inline-block; width: 100%; box-sizing: border-box; text-align: center; margin-bottom: 8px; text-decoration: none; background: #37474f; color: #fff; padding: 10px; border-radius: 8px; }
        .panel { background: #222; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        input[type=text], input[type=range] { width: 100%; box-sizing: border-box; }
        input[type=text] { background: #333; border: 1px solid #555; color: #fff; border-radius: 8px; padding: 10px; margin-top: 8px; }
        ul { list-style: none; margin: 0; padding: 0; max-height: 52vh; overflow: auto; }
        li { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #303030; border-radius: 8px; padding: 8px; margin: 6px 0; }
        .song-btn { border: 0; border-radius: 999px; background: #00897b; color: #fff; padding: 6px 12px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <a class="link" href="/admin">⚙️ Admin</a>
    <a class="link" href="/queue">📋 Queue 管理</a>

    <div class="row">
        <button class="btn pause" onclick="cmd('pause')">⏯ 暫停/播放</button>
        <button class="btn stop" onclick="cmd('cut')">⏭ 切歌</button>
        <button class="btn vocal" onclick="track('original')">🎤 原唱</button>
        <button class="btn inst" onclick="track('instrumental')">🎧 伴奏</button>
    </div>

    <button id="skipIntro" class="btn skip" onclick="skipIntro()">⏩ 跳過前奏</button>

    <div class="panel">
        <div>🔊 音量 <span id="volText">100%</span></div>
        <input type="range" id="vol" min="0" max="2" step="0.05" value="1" oninput="setVolume()">
    </div>

    <div class="panel">
        <div>🔎 點歌</div>
        <input id="search" type="text" placeholder="搜尋歌曲" oninput="renderSongs()">
    </div>

    <ul id="songs"></ul>

    <script>
        const socket = io({ query: { role: 'remote' } });
        const songsEl = document.getElementById('songs');
        const skipEl = document.getElementById('skipIntro');
        let songs = [];
        let latestPosition = 0;

        function cmd(action) { socket.emit('control', action); }
        function track(mode) { socket.emit('change_track', mode); }
        function skipIntro() { socket.emit('skip_intro'); }

        function setVolume() {
            const vol = Number(document.getElementById('vol').value);
            document.getElementById('volText').innerText = `${Math.round(vol * 100)}%`;
            socket.emit('control_effect', { volume: vol });
        }

        function enqueue(filename, insertNext = false) {
            if (insertNext) socket.emit('queue_insert_next', { filename, title: filename });
            else socket.emit('add_to_queue', { filename, title: filename });
        }

        function renderSongs() {
            const key = document.getElementById('search').value.toLowerCase();
            songsEl.innerHTML = '';
            songs.filter(x => x.toLowerCase().includes(key)).forEach(song => {
                const li = document.createElement('li');
                li.innerHTML = `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${song}</span>
                                <button class="song-btn" onclick="enqueue('${song.replace(/'/g, "\\'")}')">點播</button>`;
                songsEl.appendChild(li);
            });
        }

        function loadSongs() {
            fetch('/api/list').then(r => r.json()).then(data => {
                songs = data;
                renderSongs();
            });
        }

        socket.on('playback_snapshot', (snapshot) => {
            const current = Number(snapshot.position || 0);
            latestPosition = current;
            const hideAt = Number(snapshot.intro_skip_hide_after);
            const canShow = Number.isFinite(hideAt) && Number.isFinite(Number(snapshot.intro_skip_to)) && current < hideAt && !snapshot.intro_skip_used;
            skipEl.style.display = canShow ? 'block' : 'none';
        });

        socket.on('apply_effect', (data) => {
            if (data.volume !== undefined) {
                document.getElementById('vol').value = data.volume;
                document.getElementById('volText').innerText = `${Math.round(data.volume * 100)}%`;
            }
        });

        socket.on('refresh_list', loadSongs);
        loadSongs();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KTV 遙控器</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; margin: 0; padding: 12px; }
        .btn { width: 100%; padding: 14px; margin: 6px 0; border: 0; border-radius: 8px; font-size: 16px; font-weight: bold; color: #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .pause { background: #2196F3; } .stop { background: #F44336; }
        .vocal { background: #FF9800; color: #111; } .inst { background: #FFC107; color: #111; }
        .nav { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .nav a { text-align: center; background: #546E7A; color: #fff; text-decoration: none; padding: 10px; border-radius: 8px; font-size: 14px; }
        .search { width: 100%; padding: 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; margin: 10px 0; box-sizing: border-box; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: #2c2c2c; margin: 6px 0; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .song-btn { background: #009688; color: #fff; border: 0; border-radius: 16px; padding: 6px 14px; }
        #state { color: #9E9E9E; font-size: 13px; margin-bottom: 8px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="nav">
        <a href="/queue">📋 Queue</a>
        <a href="/player">📺 Player</a>
        <a href="/admin">⚙️ Admin</a>
    </div>
    <div id="state">連線中...</div>

    <div class="grid">
        <button class="btn pause" onclick="cmd('pause')">⏯ 暫停/繼續</button>
        <button class="btn stop" onclick="cmd('cut')">⏹ 切下一首</button>
        <button class="btn vocal" onclick="track('original')">🎤 原唱</button>
        <button class="btn inst" onclick="track('instrumental')">🚫 伴奏</button>
    </div>

    <button id="skipBtn" class="btn" style="background:#8E24AA;display:none;" onclick="socket.emit('skip_intro')">⏩ 跳過前奏</button>

    <input class="search" id="search" placeholder="🔍 搜尋歌曲..." oninput="renderList()" />
    <ul id="list"></ul>

<script>
const socket = io();
let songs = [];
let snapshot = null;

socket.on('connect', () => {
    socket.emit('register_client', { role: 'remote' });
    socket.emit('request_state');
});

function cmd(action) { socket.emit('control', action); }
function track(mode) { socket.emit('change_track', mode); }

function addSong(filename) {
    socket.emit('add_to_queue', { filename });
}

function loadSongs() {
    fetch('/api/list').then(r => r.json()).then(data => {
        songs = data;
        renderList();
    });
}

function renderList() {
    const key = document.getElementById('search').value.toLowerCase();
    const ul = document.getElementById('list');
    ul.innerHTML = '';
    songs.filter(s => s.toLowerCase().includes(key)).forEach(s => {
        const li = document.createElement('li');
        li.innerHTML = `<span style="max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.replace('.mp4','')}</span><button class="song-btn">點播</button>`;
        li.querySelector('button').onclick = () => addSong(s);
        ul.appendChild(li);
    });
}

socket.on('playback_snapshot', (s) => {
    snapshot = s;
    const cur = s.current_song ? s.current_song.replace('.mp4','') : '(無)';
    document.getElementById('state').innerText = `狀態: ${s.status} | 目前: ${cur} | 待播: ${s.queue.length}`;

    let pos = Number(s.position || 0);
    if (s.status === 'playing' && s.server_time) pos += Math.max(0, Date.now()/1000 - s.server_time);
    const canSkip = s.intro_skip_at !== null && s.intro_skip_at !== undefined && pos < s.intro_skip_at;
    document.getElementById('skipBtn').style.display = canSkip ? 'block' : 'none';
});

socket.on('refresh_list', loadSongs);
loadSongs();
</script>
</body>
</html>

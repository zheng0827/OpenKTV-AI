<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTV Combo</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; height: 100vh; display: flex; overflow: hidden; }
        #left { flex: 2; border-right: 2px solid #222; }
        #right { flex: 1; display: flex; flex-direction: column; min-width: 360px; }
        iframe { width: 100%; height: 100%; border: 0; }
        #tabs { display: flex; gap: 8px; padding: 8px; background: #1f1f1f; }
        button { flex: 1; border: 0; border-radius: 6px; padding: 10px; background: #37474F; color: #fff; font-weight: bold; }
        @media (max-width: 960px) {
            body { flex-direction: column; }
            #left { flex: none; height: 45vh; border-right: 0; border-bottom: 2px solid #222; }
            #right { min-width: 0; height: 55vh; }
        }
    </style>
</head>
<body>
    <div id="left"><iframe src="/player"></iframe></div>
    <div id="right">
        <div id="tabs">
            <button onclick="switchPane('/remote')">Remote</button>
            <button onclick="switchPane('/queue')">Queue</button>
        </div>
        <iframe id="pane" src="/remote"></iframe>
    </div>
<script>
function switchPane(src){ document.getElementById('pane').src = src; }
</script>
</body>
</html>

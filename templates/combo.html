<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTV Combo Console</title>
    <style>
        body { margin: 0; display: grid; grid-template-columns: 2fr 1fr; height: 100vh; background: #101010; }
        #left, #right { border: 0; width: 100%; height: 100%; }
        #controls { position: fixed; right: 12px; top: 12px; z-index: 9; display: flex; gap: 6px; }
        #controls button { border: 0; border-radius: 999px; padding: 8px 12px; background: rgba(0,0,0,0.55); color: #fff; }
        #controls button.active { background: #1e88e5; }
        @media (max-width: 960px) {
            body { grid-template-columns: 1fr; grid-template-rows: 52vh 48vh; }
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="btn-remote" onclick="switchPanel('remote')">Remote</button>
        <button id="btn-queue" onclick="switchPanel('queue')">Queue</button>
    </div>

    <iframe id="left" src="/player"></iframe>
    <iframe id="right" src="/remote"></iframe>

    <script>
        function switchPanel(panel) {
            const right = document.getElementById('right');
            const mode = panel === 'queue' ? 'queue' : 'remote';
            right.src = mode === 'queue' ? '/queue' : '/remote';
            localStorage.setItem('combo.rightPanel', mode);
            document.getElementById('btn-remote').classList.toggle('active', mode === 'remote');
            document.getElementById('btn-queue').classList.toggle('active', mode === 'queue');
        }
        switchPanel(localStorage.getItem('combo.rightPanel') || 'remote');
    </script>
</body>
</html>

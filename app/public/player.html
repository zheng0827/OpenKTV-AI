<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenKTV 播放器</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#090b13;--panel:#121624;--panel-soft:#191e30;--line:#292f45;--text:#f6f5ff;--muted:#a5abc0;--accent:#8874ff;--mint:#72e1c1;--danger:#ff8798}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% -20%,#272044 0,transparent 44%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    header{min-height:76px;padding:12px clamp(18px,4vw,52px);display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #ffffff12;background:#0d101beF;backdrop-filter:blur(16px)}
    .brand{display:flex;align-items:center;gap:12px;font-size:1.15rem;font-weight:800;letter-spacing:.02em}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(140deg,#a18cff,#6753e8);box-shadow:0 8px 24px #7760ff44}
    .pill{border:1px solid #ffffff1c;border-radius:99px;padding:6px 11px;color:#c2c6d8;font-size:.78rem;font-weight:600}
    main{width:min(1500px,100%);min-height:calc(100vh - 146px);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);gap:20px;padding:clamp(14px,2.5vw,30px)}
    .stage,.side{border:1px solid #ffffff12;border-radius:22px;background:linear-gradient(145deg,#171b2a,#10131e);box-shadow:0 18px 60px #0003;overflow:hidden}
    .stage{position:relative;display:grid;place-items:center;min-height:clamp(380px,68vh,850px);background:radial-gradient(ellipse at center,#181b29,#05060a 75%)}
    video{width:100%;height:100%;max-height:calc(100vh - 210px);object-fit:contain}.empty{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;color:#aab0c4;padding:24px}
    .empty:before{content:"♫";width:76px;height:76px;margin:auto;display:grid;place-items:center;border-radius:24px;background:#ffffff0c;color:var(--accent);font-size:2.5rem}
    .lyrics{position:absolute;left:5%;right:5%;bottom:6%;text-align:center;font-size:clamp(1.1rem,3.5vw,2.8rem);font-weight:800;text-shadow:0 2px 8px #000,0 0 18px #000;pointer-events:none}
    .lyrics div{padding:4px}.lyrics .active{color:#ffe28a}
    .side{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
    .song-card,.section-card{padding:17px;border:1px solid #ffffff10;border-radius:17px;background:#ffffff05}
    .side h2{margin:0 0 4px;font-size:1.35rem;line-height:1.25}.side h3{margin:0 0 12px;font-size:1rem}.sub{color:var(--muted);font-size:.87rem;overflow-wrap:anywhere}
    button,input,select{font:inherit;border-radius:12px;border:1px solid #ffffff18;padding:11px 13px;background:#1b2030;color:var(--text)}
    button{cursor:pointer;background:linear-gradient(135deg,#907bff,#6754df);border:0;font-weight:700;transition:transform .16s,filter .16s}
    button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}button.secondary{background:#252a3b}button:disabled{opacity:.45;cursor:not-allowed}
    .row{display:flex;gap:8px;margin:12px 0}.row>*{min-width:0;flex:1}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
    label{display:grid;gap:7px;margin:12px 0;color:#d3d6e4;font-size:.84rem;font-weight:600}
    input[type=url],select{width:100%;min-width:0;outline:none}input:focus,select:focus{border-color:#a18cff;box-shadow:0 0 0 3px #8874ff25}
    .meter{width:100%;accent-color:var(--accent)}#qr{width:min(180px,100%);display:block;border-radius:14px;background:white;margin:14px auto 0;padding:8px}#qr[hidden]{display:none}
    .queue{padding:0;margin:0;list-style:none}.queue li{padding:10px 0;border-bottom:1px solid #ffffff12}.queue li:last-child{border-bottom:0}
    .mic{border-color:#72e1c124;background:linear-gradient(150deg,#72e1c10b,#ffffff04)}
    #micToggle{width:100%}
    #error{margin:0;padding:0;color:var(--danger);font-size:.86rem}
    #bottom{min-height:70px;display:flex;align-items:center;gap:8px;padding:10px clamp(18px,4vw,52px);border-top:1px solid #ffffff12;background:#0d101beF}
    #bottom a{color:#bdc2d7;text-decoration:none;padding:9px 12px;border-radius:10px}#bottom a:hover{background:#ffffff0c;color:white}#status{margin-left:auto;color:var(--mint);font-size:.86rem}
    @media(max-width:900px){main{grid-template-columns:1fr;min-height:auto}.stage{min-height:52vw;max-height:70vh}.side{overflow:visible}.brand{font-size:1rem}}
    @media(max-width:520px){header{min-height:66px;padding:10px 14px}.brand-mark{width:34px;height:34px}.pill{padding:5px 8px;font-size:.7rem}main{gap:12px;padding:12px}.stage{min-height:56vw;border-radius:17px}.side{padding:13px;gap:12px}.song-card,.section-card{padding:15px}#bottom{min-height:58px;padding:8px 10px}}
  </style>
</head>
<body>
  <header><div class="brand"><span class="brand-mark">🎤</span><span>OpenKTV</span><span class="pill" id="roomLabel">尚未加入歌房</span></div><button id="createRoom">＋ 建立歌房</button></header>
  <main>
    <section class="stage"><video id="video" playsinline></video><audio id="instrumental" preload="auto"></audio><div class="lyrics" id="lyrics"></div><div class="empty" id="empty">建立或加入歌房後即可開始播放</div></section>
    <aside class="side">
      <section class="song-card"><h2 id="songTitle">🎵 等待點歌</h2><div class="sub" id="songArtist">加入歌房以開始</div>
        <div class="controls"><button id="play">▶️ 播放</button><button class="secondary" id="pause">⏸️ 暫停</button><button class="secondary" id="next">⏭️ 切歌</button></div>
        <label>🔊 播放音量 <input class="meter" id="musicVolume" type="range" min="0" max="1" step=".01" value="1"></label>
      </section>
      <section class="section-card"><h3>📲 手機掃碼加入</h3><div class="sub" id="joinUrl">建立歌房後顯示手機加入連結</div><img id="qr" hidden alt="手機加入歌房 QR Code"></section>
      <section class="section-card"><h3>📃 播放佇列</h3><ul class="queue" id="queue"></ul></section>
      <section class="section-card mic"><h3>🎙️ 麥克風監聽</h3><p class="sub">使用低延遲本機處理；建議配戴耳機以避免喇叭回授。</p>
        <button id="micToggle" class="secondary">🎙️ 啟用麥克風監聽</button>
        <label class="sub">✨ 混響量 <input class="meter" id="reverb" type="range" min="0" max=".8" step=".01" value=".25"></label>
      </section>
      <p class="sub" id="error"></p>
    </aside>
  </main>
  <nav id="bottom"><a href="/">⌂ 首頁</a><a href="/download" id="downloadLink" target="_blank" rel="noopener">🎧 新增歌曲</a><a href="/remote">📱 手機點歌</a><span id="status">未連線</span></nav>
  <script type="module">
    const video=document.querySelector('#video'), instrumental=document.querySelector('#instrumental');
    const roomLabel=document.querySelector('#roomLabel'), errorBox=document.querySelector('#error');
    let socket=null, roomId='', adminToken='', lastSongId='', micStream=null, audioContext=null, micWetGain=null;
    let roomState=null, syncBusy=false, lyricLines=[];
    const escapeMedia=name=>`/media/${encodeURIComponent(name||'')}`;
    function report(message){errorBox.textContent=message||''}
    function connectRoom(id,token){
      if(socket)socket.disconnect();
      roomId=id;adminToken=token||'';roomLabel.textContent=`歌房 ${id}`;
      socket=io({auth:{roomId:id,role:'admin',token:adminToken}});
      socket.on('connect',()=>document.querySelector('#status').textContent='已同步連線');
      socket.on('connect_error',()=>{document.querySelector('#status').textContent='連線失敗';report('歌房連線驗證失敗，請重新建立歌房。')});
      socket.on('room_state',state=>{roomState=state;render(state)});
      socket.on('operation_error',message=>report(`操作失敗：${message.code}`));
      document.querySelector('#play').disabled=!adminToken;
      document.querySelector('#pause').disabled=!adminToken;
      document.querySelector('#next').disabled=!adminToken;
      document.querySelector('#downloadLink').href=`/download?room=${encodeURIComponent(id)}`;
      if(token){localStorage.setItem(`openktv-admin-${id}`,token);localStorage.setItem('openktv-last-admin-room',id)}
    }
    function render(state){
      const current=state.current;
      document.querySelector('#empty').hidden=Boolean(current);
      document.querySelector('#songTitle').textContent=current?.song_name||current?.title||'等待點歌';
      document.querySelector('#songArtist').textContent=current?.artist_name||'';
      document.querySelector('#queue').replaceChildren(...(state.queue||[]).map(item=>{const li=document.createElement('li');li.textContent=`${item.song_name||item.title} · ${item.artist_name||''}`;return li}));
      document.querySelector('#musicVolume').value=state.effects?.volume??1;
      document.querySelector('#reverb').value=state.effects?.reverb??.25;
      if(!current){video.pause();instrumental.pause();return}
      const nextId=String(current.id||current.video_filename);
      if(nextId!==lastSongId){
        lastSongId=nextId;video.muted=true;video.src=escapeMedia(current.video_filename);
        const accompaniment=current.accompaniment_filename||current.instrumental_filename;
        if(!accompaniment){report('此歌曲沒有伴奏音檔，為避免原唱外漏，播放器已停止。');instrumental.removeAttribute('src');return}
        report('');instrumental.src=escapeMedia(accompaniment);video.load();instrumental.load();
        loadLyrics(current.lyrics_filename);
      }
      const target=Math.max(0,state.position||0);
      renderLyrics(target);
      if(Math.abs(instrumental.currentTime-target)>.45&&!syncBusy){syncBusy=true;instrumental.currentTime=target;setTimeout(()=>syncBusy=false,250)}
      instrumental.volume=Number(document.querySelector('#musicVolume').value);
      if(state.isPlaying){instrumental.play().catch(()=>report('請先點擊頁面，允許瀏覽器播放音訊。'));video.play().catch(()=>{})}
      else{instrumental.pause();video.pause()}
    }
    async function loadLyrics(filename){
      lyricLines=[];document.querySelector('#lyrics').replaceChildren();
      if(!filename)return;
      try{
        const response=await fetch(escapeMedia(filename));if(!response.ok)return;
        const text=await response.text();
        lyricLines=text.split(/\r?\n/).flatMap(line=>{
          const match=line.match(/^%\s*(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+(.+)$/);
          return match?[{start:Number(match[1]),end:Number(match[2]),text:match[3]}]:[];
        });
      }catch(_){lyricLines=[]}
    }
    function renderLyrics(position){
      let active=-1;
      for(let i=0;i<lyricLines.length;i++){if(position>=lyricLines[i].start&&position<=lyricLines[i].end){active=i;break}}
      const shown=active>=0?[lyricLines[active-1]?.text,lyricLines[active].text,lyricLines[active+1]?.text].filter(Boolean):[];
      const lyrics=document.querySelector('#lyrics');lyrics.replaceChildren(...shown.map((text,index)=>{const line=document.createElement('div');line.textContent=text;if(index===(shown.length>1?1:0))line.className='active';return line}));
    }
    async function newRoom(){
      try{
        const response=await fetch('/api/rooms',{method:'POST'});const data=await response.json();
        connectRoom(data.roomId,data.adminToken);
        const qrResponse=await fetch(`/api/rooms/${data.roomId}/qr`);const qr=await qrResponse.json();
        document.querySelector('#joinUrl').textContent=qr.joinUrl;
        const image=document.querySelector('#qr');image.src=qr.dataUrl;image.hidden=false;
        history.replaceState(null,'',`/player?room=${data.roomId}`);
      }catch(_){report('建立歌房失敗，請檢查播放服務。')}
    }
    document.querySelector('#createRoom').onclick=newRoom;
    document.querySelector('#play').onclick=()=>socket?.emit('control',{action:'play'});
    document.querySelector('#pause').onclick=()=>socket?.emit('control',{action:'pause'});
    document.querySelector('#next').onclick=()=>socket?.emit('control',{action:'next'});
    document.querySelector('#musicVolume').oninput=e=>{instrumental.volume=Number(e.target.value);socket?.emit('set_effects',{volume:Number(e.target.value)})};
    document.querySelector('#reverb').oninput=e=>{
      if(audioContext&&micWetGain)micWetGain.gain.setTargetAtTime(Number(e.target.value)*.35,audioContext.currentTime,.04);
      socket?.emit('set_effects',{reverb:Number(e.target.value)});
    };
    video.onended=()=>{if(roomState?.current)socket?.emit('song_ended',{songId:roomState.current.id})};
    window.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement===document.body){e.preventDefault();socket?.emit('control',{action:roomState?.isPlaying?'pause':'play'})}});
    async function toggleMic(){
      try{
        const button=document.querySelector('#micToggle');
        if(micStream){
          micStream.getTracks().forEach(track=>track.stop());micStream=null;
          if(audioContext)await audioContext.close();
          audioContext=null;micWetGain=null;button.textContent='啟用麥克風監聽';button.classList.add('secondary');return;
        }
        micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:{ideal:1},latency:{ideal:0},echoCancellation:true,noiseSuppression:false,autoGainControl:false}});
        const AudioContextClass=window.AudioContext||window.webkitAudioContext;
        audioContext=new AudioContextClass({latencyHint:'interactive'});
        await audioContext.resume();
        const input=audioContext.createMediaStreamSource(micStream), highpass=audioContext.createBiquadFilter(), compressor=audioContext.createDynamicsCompressor();
        highpass.type='highpass';highpass.frequency.value=90;
        compressor.threshold.value=-12;compressor.knee.value=8;compressor.ratio.value=6;compressor.attack.value=.003;compressor.release.value=.12;
        const dry=audioContext.createGain();micWetGain=audioContext.createGain();
        dry.gain.value=.8;micWetGain.gain.value=Number(document.querySelector('#reverb').value)*.35;
        input.connect(highpass).connect(compressor);compressor.connect(dry).connect(audioContext.destination);
        for(const delaySeconds of [.026,.041,.059]){
          const tap=audioContext.createDelay(.1);tap.delayTime.value=delaySeconds;compressor.connect(tap);tap.connect(micWetGain);
        }
        micWetGain.connect(audioContext.destination);
        button.textContent='關閉麥克風監聽';button.classList.remove('secondary');report('');
      }catch(_){
        micStream?.getTracks().forEach(track=>track.stop());micStream=null;
        if(audioContext)await audioContext.close().catch(()=>{});audioContext=null;micWetGain=null;
        report('無法使用麥克風，請檢查權限或使用 HTTPS。');
      }
    }
    document.querySelector('#micToggle').onclick=toggleMic;
    const queryRoom=new URLSearchParams(location.search).get('room');
    if(queryRoom){const token=localStorage.getItem(`openktv-admin-${queryRoom}`);if(token)connectRoom(queryRoom,token);else report('此歌房未儲存主機控制權，請由主播放器建立歌房。')}
  </script>
</body>
</html>

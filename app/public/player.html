<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenKTV 播放器</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#080b13;color:#f5f6fa;font:15px system-ui,sans-serif;height:100vh;overflow:hidden}
    header{height:64px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #252b39;background:#101522}
    header strong{font-size:1.15rem}.pill{border:1px solid #323b50;border-radius:99px;padding:7px 12px;color:#b8c3da}
    main{height:calc(100vh - 132px);display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:14px}
    .stage,.side{background:#111725;border:1px solid #232c3d;border-radius:18px;overflow:hidden}.stage{position:relative;display:grid;place-items:center;background:#000}
    video{width:100%;height:100%;object-fit:contain}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8792a8;padding:20px}
    .lyrics{position:absolute;left:5%;right:5%;bottom:6%;text-align:center;font-size:clamp(1.1rem,3.5vw,2.8rem);font-weight:800;text-shadow:0 2px 8px #000,0 0 18px #000;pointer-events:none}
    .lyrics div{padding:4px}.lyrics .active{color:#ffe36e}
    .side{padding:18px;overflow:auto}.side h2{margin:4px 0 14px}.sub{color:#9aa6bd;font-size:.9rem;overflow-wrap:anywhere}
    button,input{font:inherit;border-radius:10px;border:1px solid #343e53;padding:10px;background:#1b2435;color:#f3f4f6}
    button{cursor:pointer;background:#685bff;border:0;font-weight:650}button.secondary{background:#273249}button:disabled{opacity:.4;cursor:not-allowed}
    .row{display:flex;gap:8px;margin:10px 0}.row>*{min-width:0;flex:1}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
    #qr{width:100%;border-radius:12px;background:white;margin-top:10px}.queue{padding:0;list-style:none}.queue li{padding:10px 0;border-bottom:1px solid #283146}
    #bottom{height:68px;position:fixed;bottom:0;left:0;right:0;background:#111725;border-top:1px solid #252b39;display:flex;align-items:center;gap:10px;padding:10px 16px}
    #bottom a{color:#b9c5dc;text-decoration:none;padding:10px}#status{margin-left:auto;color:#9aa6bd}
    .meter{width:100%}.mic{margin-top:16px;border-top:1px solid #283146;padding-top:10px}
    @media(max-width:850px){main{grid-template-columns:1fr;height:calc(100vh - 132px);overflow:auto}.stage{min-height:42vh}.side{min-height:260px}body{overflow:auto}header{position:sticky;top:0;z-index:4}#bottom{position:sticky;bottom:0}}
  </style>
</head>
<body>
  <header><strong>🎤 OpenKTV <span class="pill" id="roomLabel">尚未加入歌房</span></strong><button id="createRoom">建立歌房</button></header>
  <main>
    <section class="stage"><video id="video" playsinline></video><audio id="instrumental" preload="auto"></audio><div class="lyrics" id="lyrics"></div><div class="empty" id="empty">建立或加入歌房後即可開始播放</div></section>
    <aside class="side">
      <h2 id="songTitle">等待點歌</h2><div class="sub" id="songArtist">加入歌房以開始</div>
      <div class="controls"><button id="play">播放</button><button class="secondary" id="pause">暫停</button><button class="secondary" id="next">切歌</button></div>
      <label>播放音量 <input class="meter" id="musicVolume" type="range" min="0" max="1" step=".01" value="1"></label>
      <h3>歌房 QR Code</h3><div class="sub" id="joinUrl">建立歌房後顯示手機加入連結</div><img id="qr" hidden alt="手機加入歌房 QR Code">
      <h3>播放佇列</h3><ul class="queue" id="queue"></ul>
      <section id="downloadPanel" class="mic" hidden>
        <h3>新增歌曲</h3>
        <input id="youtubeUrl" type="url" maxlength="2048" placeholder="YouTube 影片網址">
        <div class="row"><button id="startJob">背景下載與處理</button></div>
        <p class="sub" id="jobStatus"></p>
      </section>
      <section class="mic"><h3>麥克風即時混響</h3><p class="sub">瀏覽器提供回音消除及降噪。建議使用耳機；麥克風監聽預設關閉。</p>
        <button id="micToggle" class="secondary">啟用麥克風監聽</button>
        <label class="sub">混響量 <input class="meter" id="reverb" type="range" min="0" max=".8" step=".01" value=".25"></label>
      </section>
      <p class="sub" id="error"></p>
    </aside>
  </main>
  <nav id="bottom"><a href="/">首頁</a><a href="/remote">手機點歌</a><span id="status">未連線</span></nav>
  <script type="module">
    const video=document.querySelector('#video'), instrumental=document.querySelector('#instrumental');
    const roomLabel=document.querySelector('#roomLabel'), errorBox=document.querySelector('#error');
    let socket=null, roomId='', adminToken='', lastSongId='', micStream=null, audioContext=null;
    let roomState=null, syncBusy=false, lyricLines=[];
    const escapeMedia=name=>`/media/${encodeURIComponent(name||'')}`;
    function report(message){errorBox.textContent=message||''}
    function connectRoom(id,token){
      if(socket)socket.disconnect();
      roomId=id;adminToken=token||'';roomLabel.textContent=`歌房 ${id}`;
      socket=io({auth:{roomId:id,role:'admin',token:adminToken}});
      socket.on('connect',()=>document.querySelector('#status').textContent='已同步連線');
      socket.on('connect_error',()=>{document.querySelector('#status').textContent='連線失敗';report('歌房連線驗證失敗，請重新建立歌房。')});
      socket.on('room_state',state=>{roomState=state;render(state)});
      socket.on('operation_error',message=>report(`操作失敗：${message.code}`));
      document.querySelector('#play').disabled=!adminToken;
      document.querySelector('#pause').disabled=!adminToken;
      document.querySelector('#next').disabled=!adminToken;
      document.querySelector('#downloadPanel').hidden=!adminToken;
      if(token)localStorage.setItem(`openktv-admin-${id}`,token);
    }
    function render(state){
      const current=state.current;
      document.querySelector('#empty').hidden=Boolean(current);
      document.querySelector('#songTitle').textContent=current?.song_name||current?.title||'等待點歌';
      document.querySelector('#songArtist').textContent=current?.artist_name||'';
      document.querySelector('#queue').replaceChildren(...(state.queue||[]).map(item=>{const li=document.createElement('li');li.textContent=`${item.song_name||item.title} · ${item.artist_name||''}`;return li}));
      document.querySelector('#musicVolume').value=state.effects?.volume??1;
      document.querySelector('#reverb').value=state.effects?.reverb??.25;
      if(!current){video.pause();instrumental.pause();return}
      const nextId=String(current.id||current.video_filename);
      if(nextId!==lastSongId){
        lastSongId=nextId;video.muted=true;video.src=escapeMedia(current.video_filename);
        const accompaniment=current.accompaniment_filename||current.instrumental_filename;
        if(!accompaniment){report('此歌曲沒有伴奏音檔，為避免原唱外漏，播放器已停止。');instrumental.removeAttribute('src');return}
        report('');instrumental.src=escapeMedia(accompaniment);video.load();instrumental.load();
        loadLyrics(current.lyrics_filename);
      }
      const target=Math.max(0,state.position||0);
      renderLyrics(target);
      if(Math.abs(instrumental.currentTime-target)>.45&&!syncBusy){syncBusy=true;instrumental.currentTime=target;setTimeout(()=>syncBusy=false,250)}
      instrumental.volume=Number(document.querySelector('#musicVolume').value);
      if(state.isPlaying){instrumental.play().catch(()=>report('請先點擊頁面，允許瀏覽器播放音訊。'));video.play().catch(()=>{})}
      else{instrumental.pause();video.pause()}
    }
    async function loadLyrics(filename){
      lyricLines=[];document.querySelector('#lyrics').replaceChildren();
      if(!filename)return;
      try{
        const response=await fetch(escapeMedia(filename));if(!response.ok)return;
        const text=await response.text();
        lyricLines=text.split(/\r?\n/).flatMap(line=>{
          const match=line.match(/^%\s*(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+(.+)$/);
          return match?[{start:Number(match[1]),end:Number(match[2]),text:match[3]}]:[];
        });
      }catch(_){lyricLines=[]}
    }
    function renderLyrics(position){
      let active=-1;
      for(let i=0;i<lyricLines.length;i++){if(position>=lyricLines[i].start&&position<=lyricLines[i].end){active=i;break}}
      const shown=active>=0?[lyricLines[active-1]?.text,lyricLines[active].text,lyricLines[active+1]?.text].filter(Boolean):[];
      const lyrics=document.querySelector('#lyrics');lyrics.replaceChildren(...shown.map((text,index)=>{const line=document.createElement('div');line.textContent=text;if(index===(shown.length>1?1:0))line.className='active';return line}));
    }
    async function newRoom(){
      try{
        const response=await fetch('/api/rooms',{method:'POST'});const data=await response.json();
        connectRoom(data.roomId,data.adminToken);
        const qrResponse=await fetch(`/api/rooms/${data.roomId}/qr`);const qr=await qrResponse.json();
        document.querySelector('#joinUrl').textContent=qr.joinUrl;
        const image=document.querySelector('#qr');image.src=qr.dataUrl;image.hidden=false;
        history.replaceState(null,'',`/player?room=${data.roomId}`);
      }catch(_){report('建立歌房失敗，請檢查播放服務。')}
    }
    document.querySelector('#createRoom').onclick=newRoom;
    document.querySelector('#play').onclick=()=>socket?.emit('control',{action:'play'});
    document.querySelector('#pause').onclick=()=>socket?.emit('control',{action:'pause'});
    document.querySelector('#next').onclick=()=>socket?.emit('control',{action:'next'});
    document.querySelector('#musicVolume').oninput=e=>{instrumental.volume=Number(e.target.value);socket?.emit('set_effects',{volume:Number(e.target.value)})};
    document.querySelector('#reverb').oninput=e=>socket?.emit('set_effects',{reverb:Number(e.target.value)});
    document.querySelector('#startJob').onclick=async()=>{
      const target=document.querySelector('#jobStatus'),url=document.querySelector('#youtubeUrl').value.trim();
      if(!/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(url)){target.textContent='請輸入有效的 YouTube URL';return}
      try{
        const response=await fetch(`/api/rooms/${roomId}/jobs`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+adminToken},body:JSON.stringify({url})});
        const job=await response.json();
        if(!response.ok)throw new Error(job.error||'job_submit_failed');
        target.textContent=`工作已加入佇列：${job.job_id}`;
        const timer=setInterval(async()=>{
          try{
            const statusResponse=await fetch(`/api/rooms/${roomId}/jobs/${job.job_id}`,{headers:{Authorization:'Bearer '+adminToken}});
            const status=await statusResponse.json();
            target.textContent=`${status.status} · attempt ${status.attempt||1} · ${status.progress||0}%`;
            if(['complete','failed'].includes(status.status)){clearInterval(timer);if(status.status==='failed')target.textContent+=` · ${status.error||''}`}
          }catch(_){clearInterval(timer);target.textContent='無法讀取背景工作狀態'}
        },2000);
      }catch(error){target.textContent=`無法提交工作：${error.message}`}
    };
    video.onended=()=>{if(roomState?.current)socket?.emit('song_ended',{songId:roomState.current.id})};
    window.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement===document.body){e.preventDefault();socket?.emit('control',{action:roomState?.isPlaying?'pause':'play'})}});
    async function toggleMic(){
      try{
        if(micStream){micStream.getTracks().forEach(track=>track.stop());micStream=null;document.querySelector('#micToggle').textContent='啟用麥克風監聽';return}
        micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
        audioContext=new AudioContext();
        const input=audioContext.createMediaStreamSource(micStream), highpass=audioContext.createBiquadFilter(), compressor=audioContext.createDynamicsCompressor();
        highpass.type='highpass';highpass.frequency.value=90;compressor.threshold.value=-18;compressor.ratio.value=4;
        const dry=audioContext.createGain(), wet=audioContext.createGain(), convolver=audioContext.createConvolver();
        const impulse=audioContext.createBuffer(2,audioContext.sampleRate*1.7,audioContext.sampleRate);
        for(let channel=0;channel<2;channel++){const data=impulse.getChannelData(channel);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,3)}
        convolver.buffer=impulse;dry.gain.value=.8;wet.gain.value=Number(document.querySelector('#reverb').value);
        input.connect(highpass).connect(compressor);compressor.connect(dry).connect(audioContext.destination);compressor.connect(convolver).connect(wet).connect(audioContext.destination);
        document.querySelector('#reverb').oninput=e=>{wet.gain.setTargetAtTime(Number(e.target.value),audioContext.currentTime,.05);socket?.emit('set_effects',{reverb:Number(e.target.value)})};
        document.querySelector('#micToggle').textContent='關閉麥克風監聽';
      }catch(_){micStream=null;report('無法使用麥克風，請檢查權限或使用 HTTPS。')}
    }
    document.querySelector('#micToggle').onclick=toggleMic;
    const queryRoom=new URLSearchParams(location.search).get('room');
    if(queryRoom){const token=localStorage.getItem(`openktv-admin-${queryRoom}`);if(token)connectRoom(queryRoom,token);else report('此歌房未儲存主機控制權，請由主播放器建立歌房。')}
  </script>
</body>
</html>

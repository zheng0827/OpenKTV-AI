<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新增歌曲 · OpenKTV</title>
  <style>
    :root{color-scheme:dark;--bg:#090b13;--panel:#151929;--line:#292f45;--text:#f6f5ff;--muted:#a5abc0;--accent:#8874ff;--mint:#72e1c1;--danger:#ff8798}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% -20%,#272044 0,transparent 44%),var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    header,nav{display:flex;align-items:center;gap:12px;padding:14px clamp(16px,5vw,64px);border-bottom:1px solid #ffffff12;background:#0d101beF}
    .brand{font-weight:850;font-size:1.15rem;text-decoration:none;color:white}.brand-mark{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:8px;border-radius:12px;background:linear-gradient(140deg,#a18cff,#6753e8)}
    nav{border:0;border-top:1px solid #ffffff12;flex-wrap:wrap}nav a{padding:9px 12px;border-radius:10px;color:#c8cce0;text-decoration:none}nav a:hover{background:#ffffff0c;color:white}
    main{width:min(900px,100%);margin:34px auto;padding:0 18px 42px}.eyebrow{color:var(--mint);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}
    h1{margin:6px 0;font-size:clamp(2rem,6vw,3.4rem);line-height:1.1}.intro{max-width:620px;color:var(--muted);line-height:1.7}
    .card{margin-top:24px;padding:clamp(18px,4vw,32px);border:1px solid #ffffff12;border-radius:24px;background:linear-gradient(145deg,#171b2a,#10131e);box-shadow:0 20px 70px #0004}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}.field{display:grid;gap:8px;margin:13px 0;color:#d3d6e4;font-weight:650;font-size:.9rem}.wide{grid-column:1/-1}
    input,select,button{font:inherit;border-radius:13px;border:1px solid #ffffff1c;padding:13px 14px;background:#1b2030;color:var(--text);min-width:0;width:100%}
    input:focus,select:focus{outline:2px solid #8874ff80;border-color:var(--accent)}button{border:0;background:linear-gradient(135deg,#907bff,#6754df);font-weight:750;cursor:pointer;transition:filter .15s,transform .15s}
    button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}button:disabled{opacity:.55;cursor:wait}
    .submit{margin-top:16px;min-height:52px}.hint{color:var(--muted);font-size:.88rem}.notice{padding:14px;border-radius:14px;background:#8874ff14;color:#d7d0ff}
    #status{min-height:1.6em;margin:18px 0 0;color:var(--mint);overflow-wrap:anywhere}.error{color:var(--danger)!important}
    #noRoom[hidden],#form[hidden]{display:none}
    @media(max-width:620px){header{padding:12px 15px}main{margin:23px auto}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{border-radius:18px}nav{padding:10px}}
  </style>
</head>
<body>
  <header><a class="brand" href="/"><span class="brand-mark">♫</span>OpenKTV</a><span class="hint">歌曲管理</span></header>
  <main>
    <div class="eyebrow">♫ 曲庫管理</div>
    <h1>新增一首好歌</h1>
    <p class="intro">貼上 YouTube 影片連結，背景完成歌曲下載、伴奏分離與歌詞處理。歌曲會加入伺服器的全域共用曲庫，所有歌房都能搜尋播放；工作狀態顯示在此頁，不會打斷播放。</p>
    <section class="card">
      <div id="noRoom" class="notice" hidden>請先從主播放器建立歌房，再開啟新增歌曲頁面。<p><a href="/player" style="color:#d7d0ff">前往主播放器 →</a></p></div>
      <form id="form" hidden>
        <p class="hint" id="roomStatus"></p>
        <div class="grid">
          <label class="field wide">🔗 YouTube 影片網址
            <input id="youtubeUrl" type="url" maxlength="2048" placeholder="https://www.youtube.com/watch?v=…" required>
          </label>
          <label class="field">🎤 手動歌名（選填）
            <input id="manualTitle" maxlength="300" placeholder="標題解析失準時可填寫">
          </label>
          <label class="field">🎙️ 歌手（選填）
            <input id="singer" maxlength="200" placeholder="歌曲的原唱歌手">
          </label>
          <label class="field">🎚️ 伴奏分離
            <select id="separatorBackend">
              <option value="hybrid">Hybrid · UVR + Demucs</option>
              <option value="demucs">Demucs</option>
              <option value="uvr">UVR</option>
            </select>
          </label>
          <label class="field">📝 歌詞對齊
            <select id="alignmentBackend">
              <option value="ctc">CTC</option>
              <option value="whisperx">WhisperX</option>
              <option value="qwen">Qwen</option>
            </select>
          </label>
        </div>
        <button class="submit" id="submit" type="submit">⬇️　開始下載與處理</button>
        <p class="hint">Spotify 搜尋使用 YouTube 標題作為比對線索；若標題解析不正確，可填寫歌名與歌手協助比對。</p>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <nav><a href="/">⌂ 首頁</a><a href="/player">🎬 主播放器</a><a href="/remote">📱 手機點歌</a></nav>
  <script type="module">
    const prefix='openktv-admin-';
    const storedRooms=Object.keys(localStorage).filter(key=>key.startsWith(prefix)).map(key=>({id:key.slice(prefix.length),token:localStorage.getItem(key)})).filter(room=>room.token);
    const requested=new URLSearchParams(location.search).get('room')?.toUpperCase();
    const lastRoom=localStorage.getItem('openktv-last-admin-room');
    const room=storedRooms.find(item=>item.id===requested)||storedRooms.find(item=>item.id===lastRoom)||storedRooms.at(-1);
    const form=document.querySelector('#form'),noRoom=document.querySelector('#noRoom'),status=document.querySelector('#status');
    form.hidden=!room;noRoom.hidden=Boolean(room);
    if(room)document.querySelector('#roomStatus').textContent=`🔐 已使用歌房 ${room.id} 的主機授權`;
    function explainError(code){
      if(code==='forbidden'||code==='room_not_found')return '歌房授權已失效或歌房已關閉。請回主播放器重新建立歌房，再從播放器開啟此下載頁。';
      if(code==='processing_service_not_configured')return '歌曲處理服務尚未設定。若分別啟動 Flask 與 Node，請在 .env 設定相同且至少 32 字元的 KTV_JOB_API_TOKEN 與 KTV_PROCESSING_API_TOKEN；或使用 python main.py 一鍵啟動。';
      return code||'發生未知錯誤';
    }
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const {id:roomId,token}=room,url=document.querySelector('#youtubeUrl').value.trim(),button=document.querySelector('#submit');
      if(!token){status.textContent='找不到這個歌房的管理權限，請由主播放器重新建立歌房。';status.className='error';return}
      if(!/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(url)){status.textContent='請輸入有效的 YouTube HTTPS 網址。';status.className='error';return}
      button.disabled=true;status.textContent='正在提交歌曲處理工作…';status.className='';
      try{
        const response=await fetch(`/api/rooms/${roomId}/jobs`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({url,title:document.querySelector('#manualTitle').value.trim(),singer:document.querySelector('#singer').value.trim(),options:{separator_backend:document.querySelector('#separatorBackend').value,alignment_backend:document.querySelector('#alignmentBackend').value}})});
        const job=await response.json();
        if(!response.ok){
          throw new Error(explainError(job.error));
        }
        status.textContent=`工作已加入佇列：${job.job_id}`;
        const timer=setInterval(async()=>{
          try{
            const check=await fetch(`/api/rooms/${roomId}/jobs/${job.job_id}`,{headers:{Authorization:'Bearer '+token}});
            const result=await check.json();
            if(!check.ok)throw new Error(explainError(result.error));
            status.textContent=`${result.status} · ${result.progress||0}%${result.error?` · ${result.error}`:''}`;
            if(['complete','failed','needs_review'].includes(result.status)){clearInterval(timer);button.disabled=false;if(result.status==='complete')status.textContent+=' · 歌曲已加入曲庫';else status.className='error'}
          }catch(error){clearInterval(timer);button.disabled=false;status.textContent=`狀態查詢失敗：${error.message}`;status.className='error'}
        },2000);
      }catch(error){status.textContent=`無法提交：${error.message}`;status.className='error';button.disabled=false}
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenKTV 手機點歌</title><script src="/socket.io/socket.io.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf1ff;font:16px system-ui,sans-serif}
    main{max-width:720px;margin:auto;padding:24px 18px 90px}h1{margin:4px 0}.hint{color:#9ba7c0;line-height:1.6}
    input,button{width:100%;border:0;border-radius:12px;padding:13px;font:inherit}input{background:#1a2437;color:white;border:1px solid #35415a}
    button{background:#695cff;color:white;font-weight:700;cursor:pointer}.bar{display:flex;gap:9px;margin:16px 0}.bar>*{flex:1}
    .song,.queue-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4px;border-bottom:1px solid #263149}
    .song small{display:block;color:#9ba7c0;margin-top:3px}.song button{width:auto;padding:9px 14px}
    .queue-item{display:block;color:#bac5db}.error{color:#ff9d9d}.tabs{display:flex;gap:8px;margin:18px 0}.tabs a{color:white;text-decoration:none;padding:10px;border-radius:9px;background:#202b40}
  </style>
</head>
<body><main>
  <h1>📱 手機點歌</h1><p class="hint">輸入歌房 ID，或使用主播放器的 QR Code 掃描加入。</p>
  <div class="bar"><input id="roomId" maxlength="12" placeholder="歌房 ID"><button id="join">加入歌房</button></div>
  <p class="hint" id="connection">尚未連線</p><p class="error" id="error"></p>
  <div class="tabs"><a href="/">系統首頁</a><a href="/player">主播放器</a></div>
  <input id="query" placeholder="搜尋歌名或歌手">
  <section><h2>搜尋結果</h2><div id="results"></div></section>
  <section><h2>播放佇列</h2><div id="queue"></div></section>
  <div class="bar"><button id="pause">暫停</button><button id="next">切歌</button></div>
  <p class="hint">遙控端可點歌；播放控制需由已授權的主播放器執行。</p>
</main>
<script type="module">
  const params=new URLSearchParams(location.search),roomField=document.querySelector('#roomId');
  roomField.value=(params.get('room')||'').toUpperCase();
  let socket=null,debounce;
  function connect(){
    const roomId=roomField.value.trim().toUpperCase();
    if(!/^[A-F0-9]{12}$/.test(roomId)){document.querySelector('#error').textContent='歌房 ID 格式錯誤';return}
    if(socket)socket.disconnect();
    socket=io({auth:{roomId,role:'remote'}});
    socket.on('connect',()=>{document.querySelector('#connection').textContent=`已加入歌房 ${roomId}`;document.querySelector('#error').textContent='';history.replaceState(null,'',`/remote?room=${roomId}`)});
    socket.on('connect_error',()=>{document.querySelector('#connection').textContent='連線失敗';document.querySelector('#error').textContent='找不到歌房或歌房已關閉'});
    socket.on('search_results',renderResults);
    socket.on('room_state',renderState);
    socket.on('operation_error',data=>document.querySelector('#error').textContent=`操作失敗：${data.code}`);
  }
  function renderResults(songs){
    const box=document.querySelector('#results');box.replaceChildren();
    for(const song of songs){const row=document.createElement('article');row.className='song';const text=document.createElement('div');text.textContent=song.song_name||song.song||song.title||'未命名歌曲';const artist=document.createElement('small');artist.textContent=song.artist_name||song.artist||'';text.append(artist);const add=document.createElement('button');add.textContent='點歌';add.onclick=()=>socket?.emit('add_to_queue',{songId:song.id});row.append(text,add);box.append(row)}
  }
  function renderState(state){
    const box=document.querySelector('#queue');box.replaceChildren();
    if(state.current){const item=document.createElement('div');item.className='queue-item';item.textContent=`▶ ${state.current.song_name||state.current.title}（播放中）`;box.append(item)}
    for(const song of state.queue||[]){const item=document.createElement('div');item.className='queue-item';item.textContent=`${song.song_name||song.title} · ${song.artist_name||''}`;box.append(item)}
  }
  document.querySelector('#join').onclick=connect;
  document.querySelector('#query').oninput=e=>{clearTimeout(debounce);debounce=setTimeout(()=>socket?.emit('search_songs',{query:e.target.value}),180)};
  document.querySelector('#pause').onclick=()=>socket?.emit('control',{action:'pause'});
  document.querySelector('#next').onclick=()=>socket?.emit('control',{action:'next'});
  if(roomField.value)connect();
</script></body></html>

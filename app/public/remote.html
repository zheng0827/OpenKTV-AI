<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>OpenKTV｜手機遙控器</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#171c25;--panel2:#222a37;--line:#303949;--text:#f4f6fb;--muted:#9aa5b5;--blue:#7fa9ff;--mint:#75e8c9;--rose:#ff7894}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding-bottom:224px}.header{position:sticky;top:0;z-index:4;background:#11151ceF;backdrop-filter:blur(15px);border-bottom:1px solid #ffffff10;padding:14px 15px 10px}.brand-row,.search-row,.section-head,.song-row,.queue-row,.controls,.profile-row{display:flex;align-items:center;justify-content:space-between;gap:9px}.brand{font-weight:900;letter-spacing:.12em}.brand i{font-style:normal;color:var(--blue)}.connection{font-size:11px;color:var(--mint)}.connection.offline{color:#ffbe72}.profile-row{margin-top:9px;justify-content:flex-start;color:var(--muted);font-size:11px}.profile-row input{width:130px;background:#0d1118;border:1px solid var(--line);border-radius:99px;color:white;padding:7px 10px}.search-row{margin-top:10px}.search-row input{flex:1;min-width:0;background:#090c12;border:1px solid var(--line);border-radius:12px;padding:12px;color:white}.button{border:1px solid var(--line);background:#ffffff08;border-radius:10px;padding:9px 11px;color:var(--text);font-weight:700}.button.primary{background:var(--blue);color:#07101f;border-color:var(--blue)}.chips{display:flex;gap:7px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.chip{flex-shrink:0;border:1px solid transparent;border-radius:99px;padding:7px 12px;background:#252b35;color:var(--muted);font-size:11px;font-weight:750}.chip.active{background:#4875dd;color:white}.tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:10px 12px;gap:7px}.tabs button{background:transparent;border:0;border-radius:10px;color:var(--muted);padding:10px;font-weight:750}.tabs button.active{background:#ffffff0e;color:var(--blue)}main{padding:0 12px}.pane[hidden]{display:none}.list{display:grid;gap:8px}.song-row,.queue-row{background:var(--panel);border:1px solid #ffffff0c;border-radius:13px;padding:12px}.song-info{min-width:0;flex:1}.title{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{color:var(--muted);font-size:11px;margin-top:3px}.song-actions{display:flex;gap:5px}.song-actions button{font-size:10px;padding:8px}.add{color:var(--mint)}.insert{color:var(--rose)}.empty{border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);padding:36px 10px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#11151cf2;backdrop-filter:blur(16px);border-top:1px solid #ffffff14;padding:8px 12px max(10px,env(safe-area-inset-bottom))}.seek{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;color:var(--muted);font-size:10px}.seek input{width:100%;accent-color:var(--blue)}.now{font-size:11px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 2px}.controls{justify-content:space-around}.controls button{border:0;background:transparent;padding:7px 4px;color:var(--text);font-size:11px;font-weight:750}.controls .play{height:45px;width:45px;border-radius:50%;background:var(--blue);color:#06101f;font-size:17px}.quick-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ffffff10;margin-top:5px;padding-top:6px}.quick-row button{background:none;border:0;color:var(--muted);font-size:11px}.notice{margin:10px 0;padding:10px;border:1px solid #ffffff12;border-radius:10px;color:var(--muted);font-size:11px}.interaction-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.interaction-grid button{height:62px;font-size:15px}.message-form{display:flex;gap:7px;margin-top:10px}.message-form input{flex:1;min-width:0;background:#11151c;border:1px solid var(--line);border-radius:10px;padding:10px;color:#fff}.confirm{position:fixed;inset:0;background:#000b;z-index:10;display:grid;place-items:center;padding:20px}.confirm[hidden]{display:none}.confirm-box{width:min(340px,100%);background:var(--panel);padding:18px;border-radius:15px;border:1px solid var(--line)}.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.badge{color:var(--mint);font-size:10px}.result-count{color:var(--muted);font-size:11px;text-align:right;padding:7px}
    @media(min-width:720px){body{max-width:700px;margin:auto;border-left:1px solid #ffffff0c;border-right:1px solid #ffffff0c}.header{position:relative}}
  </style>
</head>
<body>
  <header class="header">
    <div class="brand-row"><div class="brand">OPEN<i>KTV</i> REMOTE</div><span id="connection" class="connection offline">● 連線中</span></div>
    <div class="profile-row"><span>🎤 今晚我是</span><input id="nickname" maxlength="24" placeholder="輸入暱稱"><span class="badge">點歌時顯示</span></div>
    <div class="search-row"><input id="query" type="search" placeholder="拼音、注音、歌名、歌詞…" autocomplete="off"><button id="voice" class="button">🎤 語音</button><button id="clear" class="button">清除</button></div>
    <div class="chips" id="languages"><button class="chip active" data-language="">全部語種</button><button class="chip" data-language="國語">華語</button><button class="chip" data-language="台語">台語</button><button class="chip" data-language="粵語">粵語</button><button class="chip" data-language="韓語">K-POP</button><button class="chip" data-language="英語">英語</button><button class="chip" data-language="日語">日語</button></div>
  </header>
  <nav class="tabs" aria-label="遙控器頁面"><button class="active" data-tab="search">🔍 找歌</button><button data-tab="queue">📋 待播佇列 <span id="queueBadge"></span></button><button data-tab="fun">🎉 氣氛互動</button></nav>
  <main>
    <section id="pane-search" class="pane"><div class="result-count" id="resultCount"></div><div id="songs" class="list"><div class="empty">正在載入曲庫…</div></div><button id="more" class="button" style="width:100%;margin-top:10px">載入更多歌曲</button></section>
    <section id="pane-queue" class="pane" hidden><div id="queue" class="list"></div></section>
    <section id="pane-fun" class="pane" hidden><article class="notice">向電視送出即時氣氛訊息。語音互動僅使用文字辨識，不會串流手機麥克風音訊。</article><div class="interaction-grid"><button class="button" data-interaction="applause">👏 掌聲</button><button class="button" data-interaction="cheer">🎉 歡呼</button></div><div class="message-form"><input id="message" maxlength="100" placeholder="送一句應援訊息…"><button id="sendMessage" class="button primary">送出</button></div><article class="notice">現場音效素材尚未安裝；Key 升降調需播放端音訊引擎支援，未支援時不會假裝生效。</article></section>
  </main>
  <footer class="bottom">
    <div id="current" class="now">尚未點歌</div>
    <div class="seek"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step=".1" aria-label="播放位置"><span id="duration">0:00</span></div>
    <div class="controls"><button id="replay">⏮ 重唱</button><button id="mode">原唱</button><button id="play" class="play">▶</button><button id="next" style="color:var(--rose)">⏭ 切歌</button></div>
    <div class="quick-row"><button id="musicDown">🎵 −</button><span id="musicLabel">歌曲音量 80%</span><button id="musicUp">＋</button><button disabled title="播放端目前不支援 Key 變更">Key − / +</button></div>
  </footer>
  <div id="confirm" class="confirm" hidden><div class="confirm-box"><strong>確定切換下一首？</strong><p class="sub">目前歌曲會加入已播歷史。</p><div class="confirm-actions"><button id="cancelNext" class="button">取消</button><button id="confirmNext" class="button primary">切歌</button></div></div></div>
  <script>
    const socket=io({query:{role:'remote'}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const time=v=>{const n=Math.max(0,Math.floor(Number(v)||0));return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`};
    let queue=[],songs=[],state={},history=[],queryTimer,offset=0,total=0,requestId=0,busy=false,language='',duration=0,position=0,dragging=false;
    $('nickname').value=localStorage.getItem('ktvNickname')||'';$('nickname').oninput=()=>localStorage.setItem('ktvNickname',$('nickname').value.slice(0,24));
    document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===button));document.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!==`pane-${button.dataset.tab}`)});
    function search(reset=false){if(reset){offset=0;total=0;busy=false;requestId++;songs=[];$('songs').innerHTML='<div class="empty">搜尋中…</div>'}if(busy)return;busy=true;$('more').disabled=true;socket.emit('search_songs',{query:$('query').value.trim(),language,offset,limit:40,paginated:true,requestId})}
    $('query').oninput=()=>{clearTimeout(queryTimer);queryTimer=setTimeout(()=>search(true),180)};$('clear').onclick=()=>{$('query').value='';language='';document.querySelectorAll('[data-language]').forEach(b=>b.classList.toggle('active',!b.dataset.language));search(true)};$('more').onclick=()=>search();
    document.querySelectorAll('[data-language]').forEach(button=>button.onclick=()=>{language=button.dataset.language;document.querySelectorAll('[data-language]').forEach(b=>b.classList.toggle('active',b===button));search(true)});
    function renderSongs(rows,append=false){if(!append)$('songs').innerHTML='';if(rows.length)$('songs').insertAdjacentHTML('beforeend',rows.map(song=>`<article class="song-row"><div class="song-info"><div class="title">${esc(song.title)}</div><div class="sub">${esc(song.artist||'未知歌手')} · ${esc(song.language||'')} · ${esc(song.duration_seconds?time(song.duration_seconds):'時長未知')}</div></div><div class="song-actions"><button class="button add" data-add="${esc(song.id)}">點歌</button><button class="button insert" data-insert="${esc(song.id)}">插播</button></div></article>`).join(''));else if(!append)$('songs').innerHTML='<div class="empty">沒有找到歌曲，換個關鍵字再試試。</div>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const song=songs.find(s=>s.id===b.dataset.add);if(song)socket.emit('add_to_queue',{...song,requestedBy:$('nickname').value.trim()||'來賓'});if(navigator.vibrate)navigator.vibrate(40);toast('已加入待播')});document.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>{const song=songs.find(s=>s.id===b.dataset.insert);if(song)socket.emit('insert_to_top',{...song,requestedBy:$('nickname').value.trim()||'來賓'});document.querySelector('[data-tab="queue"]').click();toast('已插入下一首')})}
    socket.on('search_page_results',page=>{if(page?.requestId!==requestId)return;busy=false;const rows=page.items||[];songs=page.offset?[...songs,...rows]:rows;offset=songs.length;total=page.total||0;renderSongs(rows,Boolean(page.offset));$('resultCount').textContent=`${total.toLocaleString()} 首歌曲 · 已載入 ${offset} 首`;$('more').hidden=offset>=total;$('more').disabled=false});
    function renderQueue(){ $('queueBadge').textContent=queue.length?`(${Math.max(0,queue.length-1)})`:'';$('queue').innerHTML=queue.length?queue.map((song,i)=>`<article class="queue-row"><div class="song-info"><div class="title">${i===0?'▶ 播放中 · ':`#${i} · `}${esc(song.title)}</div><div class="sub">${esc(song.artist||'未知歌手')} · ${i===0?'現在播放':esc(song.requestedBy||'點播者')}</div></div>${i?`<button class="button" data-remove="${esc(song.queueId)}">移除</button>`:''}</article>`).join(''):'<div class="empty">佇列還沒有歌曲。回到找歌頁點一首歌吧！</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>socket.emit('remove_from_queue',b.dataset.remove))}
    function apply(payload){queue=payload.queue||[];history=payload.history||history;state=payload.state||{};const current=queue[0];$('current').textContent=current?`${current.title} — ${current.artist||'未知歌手'}${queue[1]?`　｜　下一首：${queue[1].title}`:''}`:'尚未點歌';$('play').textContent=state.isPlaying?'Ⅱ':'▶';$('mode').textContent=state.audioMode==='accompaniment'?'伴奏':'原唱';duration=Number(current?.duration_seconds)||0;position=Number(state.position)||0;$('duration').textContent=time(duration);$('musicLabel').textContent=`歌曲音量 ${Math.round((state.musicVol??.8)*100)}%`;if(!dragging){$('seek').max=duration||100;$('seek').value=Math.min(position,duration||100);$('elapsed').textContent=time(position)}renderQueue()}
    socket.on('sync_state',apply);socket.on('playback_snapshot',apply);socket.on('queue_updated',items=>{queue=items||[];renderQueue()});socket.on('playback_error',data=>toast(data?.message||'播放錯誤'));socket.on('connect',()=>{$('connection').textContent='● 主機已連線';$('connection').classList.remove('offline');search(true)});socket.on('disconnect',()=>{$('connection').textContent='● 重新連線中';$('connection').classList.add('offline')});
    $('play').onclick=()=>socket.emit('player_command',{isPlaying:!state.isPlaying});$('mode').onclick=()=>socket.emit('player_command',{audioMode:state.audioMode==='accompaniment'?'original':'accompaniment'});$('replay').onclick=()=>socket.emit('replay_current');$('next').onclick=()=>{$('confirm').hidden=false};$('cancelNext').onclick=()=>{$('confirm').hidden=true};$('confirmNext').onclick=()=>{socket.emit('next_song');$('confirm').hidden=true};
    $('seek').oninput=()=>{dragging=true;$('elapsed').textContent=time($('seek').value)};$('seek').onchange=()=>{socket.emit('seek',{position:Number($('seek').value)});dragging=false};setInterval(()=>{if(state.isPlaying&&!dragging&&duration){position=Math.min(duration,position+.25);$('seek').value=position;$('elapsed').textContent=time(position)}},250);
    function setMusic(value){value=Math.max(0,Math.min(1.5,value));socket.emit('player_command',{musicVol:value})}$('musicDown').onclick=()=>setMusic((state.musicVol??.8)-.1);$('musicUp').onclick=()=>setMusic((state.musicVol??.8)+.1);
    document.querySelectorAll('[data-interaction]').forEach(b=>b.onclick=()=>{socket.emit('crowd_interaction',{type:b.dataset.interaction,user:$('nickname').value.trim()||'來賓'});toast('已送出現場互動')});
    $('sendMessage').onclick=()=>{const text=$('message').value.trim();if(!text)return;socket.emit('crowd_interaction',{type:'message',text,user:$('nickname').value.trim()||'來賓'});$('message').value='';toast('應援訊息已送出')};$('message').onkeydown=e=>{if(e.key==='Enter')$('sendMessage').click()};
    $('voice').onclick=()=>{const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){toast('瀏覽器不支援語音辨識');return}const recognition=new Speech();recognition.lang='zh-TW';recognition.onresult=e=>{$('query').value=e.results[0][0].transcript;search(true)};recognition.onerror=()=>toast('請檢查麥克風權限');recognition.start()};
    let toastTimer;function toast(text){$('connection').textContent=`● ${text}`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('connection').textContent=socket.connected?'● 主機已連線':'● 重新連線中'},1800)}
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenKTV｜智慧包廂主控台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;600;700&display=swap');
:root{--ink:#0b1020;--panel:#121a2b;--muted:#8490a8;--cyan:#48e5dc;--orange:#ff9a62}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#20365b 0%,transparent 60%),var(--ink);color:#f8fafc;font-family:'Space Grotesk',sans-serif}button,input{font:inherit}.mono{font-family:'DM Mono',monospace}.panel{background:rgba(18,26,43,.82);border:1px solid rgba(148,163,184,.16);box-shadow:0 18px 60px rgba(0,0,0,.25);backdrop-filter:blur(18px)}.glow{box-shadow:0 0 0 1px rgba(72,229,220,.18),0 0 38px rgba(72,229,220,.08)}.tab{color:#8490a8}.tab.active{color:#48e5dc;border-bottom:2px solid #48e5dc}.song:hover{background:rgba(72,229,220,.08)}.hide{display:none!important}
</style>
</head>
<body>
<div class="min-h-screen max-w-[1500px] mx-auto p-4 md:p-7">
<header class="flex flex-wrap gap-4 items-center justify-between mb-5">
  <div><div class="mono text-xs tracking-[.28em] text-cyan-300">OPENKTV / ROOM CONTROL</div><h1 class="text-3xl md:text-5xl font-bold mt-1">智慧包廂主控台</h1></div>
  <div class="flex items-center gap-3"><span id="status" class="panel rounded-full px-4 py-2 text-sm text-emerald-300">● 已連線</span><button id="full" class="panel rounded-xl px-3 py-2">⛶</button></div>
</header>
<nav class="panel rounded-2xl p-1 flex gap-1 mb-5 overflow-x-auto"><button class="tab active px-4 py-3 whitespace-nowrap" data-tab="search">⌕ 點歌</button><button class="tab px-4 py-3 whitespace-nowrap" data-tab="queue">▤ 佇列 <b id="queueCount">0</b></button><button class="tab px-4 py-3 whitespace-nowrap" data-tab="lyrics">♫ 歌詞搜尋</button><button class="tab px-4 py-3 whitespace-nowrap" data-tab="mix">◉ 調音</button><button class="tab px-4 py-3 whitespace-nowrap" data-tab="admin">⚙ 管理</button></nav>
<main class="grid lg:grid-cols-[1fr_360px] gap-5">
<section class="panel rounded-3xl p-5 min-h-[620px]">
  <div id="tab-search" class="tab-page"><div class="flex flex-col md:flex-row gap-3 mb-5"><input id="query" class="flex-1 bg-slate-950/70 border border-slate-700 rounded-2xl px-5 py-3 outline-none focus:border-cyan-300" placeholder="輸入歌名、歌手、拼音、注音……"><select id="lang" class="bg-slate-950/70 border border-slate-700 rounded-2xl px-4"><option value="">全部語種</option><option>國語</option><option>台語</option><option>粵語</option><option>英語</option><option>日語</option></select></div><div id="songs" class="space-y-2"></div></div>
  <div id="tab-queue" class="tab-page hide"><h2 class="text-2xl font-bold mb-4">播放佇列</h2><div id="queue" class="space-y-2"></div></div>
  <div id="tab-lyrics" class="tab-page hide"><h2 class="text-2xl font-bold mb-2">歌詞索引搜尋</h2><p class="text-sm text-slate-400 mb-4">啟動時已將 CSV 的歌名、歌手與歌詞建立 inverse index。</p><input id="lyricQuery" class="w-full bg-slate-950/70 border border-slate-700 rounded-2xl px-5 py-3 outline-none focus:border-cyan-300" placeholder="搜尋歌詞片段，例如：我想要……"><div id="lyricResults" class="space-y-2 mt-4"></div></div>
  <div id="tab-mix" class="tab-page hide"><h2 class="text-2xl font-bold mb-5">現場混音</h2><div class="space-y-6"><label class="block">🎵 音樂 <output id="musicOut">80%</output><input id="music" class="w-full accent-cyan-300" type="range" min="0" max="1.5" step=".05" value=".8"></label><label class="block">🎤 麥克風 <output id="micOut">120%</output><input id="mic" class="w-full accent-emerald-300" type="range" min="0" max="2.5" step=".05" value="1.2"></label><label class="block">✨ 混響 <output id="reverbOut">45%</output><input id="reverb" class="w-full accent-orange-300" type="range" min="0" max="1.2" step=".02" value=".45"></label><div class="panel rounded-2xl p-4 text-sm text-slate-400">麥克風音訊在播放器端處理。若瀏覽器顯示 getUserMedia 不可用，請使用 HTTPS 或 localhost，並確認已允許麥克風權限。</div></div></div>
  <div id="tab-admin" class="tab-page hide"><h2 class="text-2xl font-bold mb-5">新增歌曲</h2><input id="yt" class="w-full bg-slate-950/70 border border-slate-700 rounded-2xl px-5 py-3" placeholder="貼上 YouTube URL"><button id="add" class="mt-3 bg-cyan-300 text-slate-950 font-bold rounded-2xl px-5 py-3">開始處理</button><div id="adminLog" class="mono whitespace-pre-wrap text-xs text-emerald-300 mt-5"></div></div>
</section>
<aside class="space-y-5"><div class="panel glow rounded-3xl p-5"><div class="mono text-xs text-slate-400">NOW PLAYING</div><div id="now" class="text-xl font-bold mt-2">尚未點歌</div><div class="flex gap-2 mt-5"><button id="mode" class="flex-1 bg-indigo-500/20 border border-indigo-300/20 rounded-xl py-3">🎙 原唱</button><button id="pause" class="flex-1 bg-slate-800 rounded-xl py-3">▶ 播放</button></div><button id="next" class="w-full mt-2 bg-orange-400 text-slate-950 rounded-xl py-3 font-bold">⏭ 切歌</button></div><div class="panel rounded-3xl p-5"><div class="mono text-xs text-slate-400 mb-3">QUICK QUEUE</div><div id="miniQueue" class="space-y-2 text-sm text-slate-300"></div></div></aside>
</main></div>
<script>
const socket=io({query:{role:'remote'}});let allSongs=[],state={};
const $=id=>document.getElementById(id);
function songHtml(s){return `<div class="song flex items-center justify-between gap-3 rounded-2xl p-3 border border-transparent"><div class="min-w-0"><div class="font-bold truncate">${esc(s.title)}</div><div class="text-xs text-slate-400 truncate">${esc(s.artist||'未知')} · ${esc(s.language||'')} · ${s.char_count||0}字</div></div><div class="flex gap-2 shrink-0"><button class="add bg-cyan-300 text-slate-950 rounded-xl px-3 py-2 text-xs font-bold" data-id="${esc(s.id)}">點歌</button><button class="insert bg-slate-800 rounded-xl px-3 py-2 text-xs" data-id="${esc(s.id)}">插播</button></div></div>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function renderSongs(rows,target='songs'){ $(target).innerHTML=rows.length?rows.map(songHtml).join(''):'<div class="text-slate-500 py-12 text-center">找不到結果</div>' }
function search(q,lyrics=false){socket.emit('search_songs',{query:q||'',language:lyrics?'':$('lang').value});}
function bindSongButtons(){document.querySelectorAll('.add').forEach(b=>b.onclick=()=>socket.emit('add_to_queue',allSongs.find(x=>x.id===b.dataset.id)));document.querySelectorAll('.insert').forEach(b=>b.onclick=()=>socket.emit('insert_to_top',allSongs.find(x=>x.id===b.dataset.id)))}
function renderQueue(q){$('queueCount').textContent=q.length;$('queue').innerHTML=q.length?q.map((s,i)=>`<div class="panel rounded-2xl p-3 flex justify-between"><div><b>${i?'':'▶ '}${esc(s.title)}</b><div class="text-xs text-slate-400">${esc(s.artist||'')}</div></div>${i?`<button class="remove text-rose-300" data-q="${esc(s.queueId)}">✕</button>`:''}</div>`).join(''):'<div class="text-slate-500 py-12 text-center">佇列目前是空的</div>';$('miniQueue').innerHTML=q.slice(0,5).map((s,i)=>`<div>${i?'↳':'▶'} ${esc(s.title)}</div>`).join('')||'無待播歌曲';document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>socket.emit('remove_from_queue',b.dataset.q))}
$('query').oninput=()=>search($('query').value);$('lang').onchange=()=>search($('query').value);$('lyricQuery').oninput=()=>{search($('lyricQuery').value,true)};
$('next').onclick=()=>socket.emit('next_song');$('pause').onclick=()=>socket.emit('player_command',{isPlaying:!state.isPlaying});$('mode').onclick=()=>socket.emit('player_command',{audioMode:state.audioMode==='original'?'accompaniment':'original'});$('full').onclick=()=>document.documentElement.requestFullscreen?.();
['music','mic','reverb'].forEach(id=>$(id).oninput=()=>{const k={music:'musicVol',mic:'micVol',reverb:'reverbVol'}[id];$(`${id}Out`).textContent=Math.round($(id).value*100)+'%';socket.emit('player_command',{[k]:Number($(id).value)})});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab-page').forEach(x=>x.classList.add('hide'));$('tab-'+b.dataset.tab).classList.remove('hide')});
socket.on('search_results',rows=>{allSongs=rows;const lyricMode=document.querySelector('#tab-lyrics:not(.hide)');renderSongs(rows,lyricMode?'lyricResults':'songs');bindSongButtons()});socket.on('sync_state',p=>{state=p.state||{};renderQueue(p.queue||[]);$('now').textContent=p.queue?.[0]?`${p.queue[0].title} · ${p.queue[0].artist||''}`:'尚未點歌';$('pause').textContent=state.isPlaying?'⏸ 暫停':'▶ 播放';$('mode').textContent=state.audioMode==='accompaniment'?'🎙 伴奏':'🎙 原唱'});socket.on('queue_updated',renderQueue);socket.on('admin_log',x=>$('adminLog').textContent+=x.msg+'\n');socket.on('playback_error',x=>alert(x.message));search('');
</script></body></html>
